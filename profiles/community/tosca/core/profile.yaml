tosca_definitions_version: tosca_2_0
profile: community.tosca.core:0.1
description: >-
  TOSCA Community Core Profile type definitions. These definitions are
  intended to be shared between profiles of all levels of abstraction.

data_types:
  JSON:
    description: >-
      The JSON type defines a string that contains data in the JSON
      format
    derived_from: string
    validation: {$validate_json: [$value]}
  YAML:
    description: >-
      The YAML type defines a string that contains data in the YAML
      format
    derived_from: string
    validation: {$validate_yaml: [$value]}
  IPv4:
    description: >-
      The IPv4 type defines a string that contain an IPv4 address
    derived_from: string
    validation:
      $matches: [$value, "^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$"]
  Port:
    description: >-
      The Port type defines integer that contain valid ports
    derived_from: integer
    validation: {$in_range: [$value, [0, 65535]]}
  Socket:
    description: >-
      Where a service is reached over the network: an address and a port.
      The address is a DNS name, an IPv4 address or an IPv6 address, the
      last without the brackets a URL puts around it.
    # The address is a string rather than IPv4 or Fqdn so that one type holds
    # every form a host takes, as SshUrl's host does; ssh_url_to_socket and
    # socket_to_ssh_url convert between the two.
    properties:
      address:
        type: string
        description: >-
          The host: a DNS name, an IPv4 address or an IPv6 address.
      port:
        type: Port
        description: >-
          The port the service listens on.
  Email:
    description: >
      The Email type defines a string that contains an email address.
      This regex is compatible with most common email formats, but is not
      fully compliant with RFCs 5321 and 5322.
      Look-ahead/look-behind assertions are intentionally avoided to maximize
      compatibility with regex engines that do not support them.
    derived_from: string
    validation:
      $matches: [$value, "^[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\\.[A-Za-z0-9-]+)*\\.[A-Za-z]{2,}$"]
  Fqdn:
    description: >
      The Fqdn type defines a string that contains a fully qualified domain
      name (FQDN).
      This regex validates the syntax of a fully qualified domain name.
      The maximum DNS name length constraint of 253 characters is not
      enforced because look-around assertions are intentionally avoided.
    derived_from: string
    validation:
      $matches: [$value, "^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+$"]
  Url:
    description: >-
      A string holding a URL in the generic syntax of RFC 3986: a scheme,
      a colon, and a remainder built from the characters a URL permits. The
      scheme says how the resource is reached. The pattern checks the generic
      syntax only; derived types add the rules of a particular scheme.
    derived_from: string
    # Look-around assertions are avoided for regex-engine portability, as in
    # the other patterns here. A bare '%' is accepted rather than requiring a
    # percent-encoded octet, matching HttpUrl's existing leniency, so that
    # rederiving HttpUrl from this type changes no value HttpUrl accepts.
    validation:
      $matches: [$value, "^[A-Za-z][A-Za-z0-9+.-]*:[A-Za-z0-9._~%!$&'()*+,;=:@/?#\\[\\]-]*$"]
  SshUrl:
    description: >-
      A URL for reaching a host over SSH, in the form ssh://host[:port]. The
      host is a DNS name, an IPv4 address or a bracketed IPv6 literal, and the
      port, from 1 to 65535, is 22 when omitted. The whole value is the scheme,
      the host and the optional port.
    derived_from: Url
    # The common subset of the provisional IANA registration and what OpenSSH,
    # Git and Docker accept. No user: the login name is the credential's name,
    # and a second source could disagree with it. No host-key fingerprint: that
    # is trust material, not an address. No path: its meaning differs by tool.
    # IPv6 literals are checked for their characters only, not their structure.
    validation:
      $matches: [$value, "^ssh://(\\[[0-9A-Fa-f:.]+\\]|[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*)(:(6553[0-5]|655[0-2][0-9]|65[0-4][0-9]{2}|6[0-4][0-9]{3}|[1-5][0-9]{4}|[1-9][0-9]{0,3}))?$"]
  HttpUrl:
    description: >
      The HttpUrl type defines a string that contains an HTTP or HTTPS URL.
      The host component must be either 'localhost', a fully qualified
      domain name (FQDN), or an IPv4 address. The host may be followed by
      a port in the range 1 to 65535, and then by a path, query or
      fragment built from the characters RFC 3986 permits there. The
      pattern is anchored at both ends, so the whole value must be a URL.
      Look-around assertions are intentionally avoided to maximize
      compatibility with regex engines that do not support them.
    derived_from: Url
    validation:
      $matches: [$value, "^https?:\/\/(localhost|([A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+)|(((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])))(:(6553[0-5]|655[0-2][0-9]|65[0-4][0-9]{2}|6[0-4][0-9]{3}|[1-5][0-9]{4}|[1-9][0-9]{0,3}))?([/?#][A-Za-z0-9._~%!$&'()*+,;=:@/?#-]*)?$"]
  GenericId:
    description: >-
      The GenericId type represents a generic string identifier. It can be used to
      derive specific types, by adding proper validation
    derived_from: string
  AlphanumericId:
    description: >-
      The alphanumericId type represents an alphanumeric type of arbitrary length
      made up only by digits and uppercase/lowercase letters
    derived_from: GenericId
    validation:
      $matches: [$value, "^[A-Za-z0-9]+$"]
  UUID:
    description: >-
      The UUID type represents an IETF RFC4122 compliant universal identifier (types 1-5)
    derived_from: GenericId
    validation:
      $matches: [$value, "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"]
  UUIDRelaxed:
    description: >-
      The UUIDRelaxed type represents an identifier with format 8-4-4-4-12 (hex digits with dashes),
      but without full compliance to IETF RFC4122
    derived_from: GenericId
    validation:
      $matches: [$value, "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"]
  CredentialRef:
    description: >-
      A reference to credential material: the path to the file holding it, and an
      identifier where one is needed.
    properties:
      name:
        type: string
        required: false
        description: >-
          Populated where the material needs an identifier -- the principal to
          authenticate as, or the entry to select inside a file that holds
          several, where leaving it unset selects the file's own default.
      file:
        type: string
        required: true
        description: >-
          Path to the file holding the material, read on the host where the
          credential is used.
  NamedCredentialRef:
    description: >-
      A CredentialRef that authenticates as someone, so it always names the
      principal.
    derived_from: CredentialRef
    properties:
      name:
        type: string
        required: true

artifact_types:
  Bash:
    description: >-
      Artifact type representing a script for the Bash shell
    mime_type: application/x-sh
    file_ext: [sh]
    #properties: TBD (e.g. to specify the shell to use, or the script entry point)
  Python:
    description: >-
      Artifact type representing a Python script
    mime_type: text/x-python
    file_ext: [py]
    #properties: TBD (e.g. to specify the Python version to use, or the script entry point)

functions:
  to_string:
    description: >-
      Convert an integer to string
    signatures:
      - arguments:
          - type: integer
            description: >-
              The integer to convert to string
        result: string
        implementation:
          primary:
            type: Python
            file: functions/to_string.py
  to_uppercase:
    description: >-
      Convert a string to upper case
    signatures:
      - arguments:
          - type: string
            description: >-
              The string to convert to upper case.
        result: string
        implementation:
          primary:
            type: Python
            file: functions/to_uppercase.py
  validate_json:
    description: >-
      Check if a string argument contains valid JSON.
    signatures:
      - arguments:
          - type: string
            description: >-
              The json string to validate.
        result: boolean
        implementation:
          primary:
            type: Python
            file: functions/validate_json.py
  decode_json:
    signatures:
      - arguments:
          - type: string
            description: >-
              The json string to decode
        implementation:
          primary:
            type: Python
            file: functions/decode_json.py
  validate_yaml:
    description: >-
      Check if a string argument contains a well-formed YAML document.
    signatures:
      - arguments:
          - type: string
            description: >-
              The yaml string to validate.
        result: boolean
        implementation:
          primary:
            type: Python
            file: functions/validate_yaml.py
  decode_yaml:
    description: >-
      Decode a YAML string. The result carries no declared type: it is
      validated where it is assigned, which is how a template that knows
      the schema of an opaque value re-establishes typing.
    signatures:
      - arguments:
          - type: string
            description: >-
              The yaml string to decode
        implementation:
          primary:
            type: Python
            file: functions/decode_yaml.py
  ssh_url_to_socket:
    description: >-
      Convert an SshUrl to a Socket. The socket's address is the URL's host,
      with the brackets removed from an IPv6 literal, and its port is the
      URL's port, or 22 where the URL gives none.
    signatures:
      - arguments:
          - type: SshUrl
            description: >-
              The URL to convert.
        result: Socket
        implementation:
          primary:
            type: Python
            file: functions/ssh_url_to_socket.py
  socket_to_ssh_url:
    description: >-
      Convert a Socket to an SshUrl. An IPv6 address is bracketed, and a port
      of 22 is left out, since SshUrl reads an absent port as 22. A socket
      with port 0 is rejected, since a URL cannot name it.
    signatures:
      - arguments:
          - type: Socket
            description: >-
              The socket to convert.
        result: SshUrl
        implementation:
          primary:
            type: Python
            file: functions/socket_to_ssh_url.py
  in_range:
    description: >
        This function provides true if the first argument (value) is within
        the range specified by the second argument.
        The range argument shall be a two-item list [min, max].
        min <= value <= max
        Arguments shall be integers, floats, strings, timestamps
        or versions.
        In any other case, including errors, it provides false.
    signatures:
      - arguments:
          - type: integer
          - type: list
            entry_schema: integer
        result: boolean
        implementation:
          primary:
            type: Python
            file: functions/in_range.py
      - arguments:
          - type: float
          - type: list
            entry_schema: float
        result: boolean
        implementation:
          primary:
            type: Python
            file: functions/in_range.py
      - arguments:
          - type: string
          - type: list
            entry_schema: string
        result: boolean
        implementation:
          primary:
            type: Python
            file: functions/in_range.py
      - arguments:
          - type: timestamp
          - type: list
            entry_schema: timestamp
        result: boolean
        implementation:
          primary:
            type: Python
            file: functions/in_range.py
      - arguments:
          - type: version
          - type: list
            entry_schema: version
        result: boolean
        implementation:
          primary:
            type: Python
            file: functions/in_range.py
  in_range_strict:
    description: >
        This function provides true if the first argument (value) is within
        the range specified by the second argument.
        The range argument shall be a two-item list [min, max].
        min < value < max
        Strict comparison is used (i.e. value cannot be equal to
        interval boundaries)
        Arguments shall be integers, floats, strings, timestamps
        or versions.
        In any other case, including errors, it provides false.
    signatures:
      - arguments:
          - type: integer
          - type: list
            entry_schema: integer
        result: boolean
        implementation:
          primary:
            type: Python
            file: functions/in_range_strict.py
      - arguments:
          - type: float
          - type: list
            entry_schema: float
        result: boolean
        implementation:
          primary:
            type: Python
            file: functions/in_range_strict.py
      - arguments:
          - type: string
          - type: list
            entry_schema: string
        result: boolean
        implementation:
          primary:
            type: Python
            file: functions/in_range_strict.py
      - arguments:
          - type: timestamp
          - type: list
            entry_schema: timestamp
        result: boolean
        implementation:
          primary:
            type: Python
            file: functions/in_range_strict.py
      - arguments:
          - type: version
          - type: list
            entry_schema: version
        result: boolean
        implementation:
          primary:
            type: Python
            file: functions/in_range_strict.py
