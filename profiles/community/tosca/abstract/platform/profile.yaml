tosca_definitions_version: tosca_2_0

profile: community.tosca.abstract.platform:0.1

description: >-
  TOSCA Platform Profile type definitions. This files contains
  definitions that provide more concrete types derived from
  Profile abstract node type

imports:
- profile: community.tosca.abstract.base:0.1

node_types:
  ServerPlatform:
    description: |
      Represents a single device. This could be a server with
      operating system software or firmware installed or a bare metal
      device on which operating system or hypervisor software needs to
      be installed.
    derived_from: Platform
    properties:
      # A NamedCredentialRef, since an SSH login always authenticates as a
      # named user.
      credentials:
        description: >-
          How the orchestrator logs in to the server: `ssh_key` names a private
          key file and `ssh_password` a file holding the password, each with the
          user to log in as.
        type: map
        key_schema:
          type: string
          validation: { $valid_values: [ $value, [ ssh_key, ssh_password ] ] }
        entry_schema:
          type: NamedCredentialRef
    requirements:
      - host:
          node: VirtualizationPlatform
  VirtualizationPlatform:
    description: |
      Represents a platform that allows on-demand creation of
      networks, virtual machines and storage. This could represent a
      Hypervisor installed on a device or an IaaS platform in the
      cloud.
    derived_from: Platform
    properties:
      # The base CredentialRef, not the Named one: token and cloud_account do not
      # always carry a name. A token file holds the token alone, and a
      # credentials file's name selects a profile within it only where it holds
      # more than one. An ssh_key always names its login, which a map with one
      # entry schema cannot require for one kind alone.
      #
      # ssh_key is admitted for a platform managed partly through an SSH login on
      # the machine it runs on, where that machine is not modelled as a server
      # platform of its own. Where it is, the login belongs on that server
      # platform instead, the rule I29 applies to container platforms.
      credentials:
        description: >-
          How the orchestrator authenticates to the platform: `token` names a
          file holding a bearer token for its API; `cloud_account` names a
          provider's credentials file, whose `name` selects a profile within it;
          and `ssh_key` names a private key and the login it authenticates, for
          a platform also managed through an SSH login on the machine it runs on.
        type: map
        key_schema:
          type: string
          validation: { $valid_values: [ $value, [ token, cloud_account, ssh_key ] ] }
        entry_schema:
          type: CredentialRef
  ContainerPlatform:
    description: |
      Container platform node type. Represents a container
      orchestration system that handles scheduling, scaling, load
      balancing, networking, and self-healing of applications.
    derived_from: Platform
    properties:
      # The base CredentialRef, not the Named one: a kubeconfig's name selects a
      # context inside the file and is absent when the file's current context is
      # wanted. Further credential kinds are open (I29).
      credentials:
        description: >-
          How the orchestrator authenticates to the platform: `kubeconfig` names
          a kubeconfig file, whose `name` selects a context within it where the
          file holds more than one.
        type: map
        key_schema:
          type: string
          validation: { $valid_values: [ $value, [ kubeconfig ] ] }
        entry_schema:
          type: CredentialRef
  PaasPlatform:
    description: |
      PaaS platform node type. Represents a platform for developing
      and deploying apps. Developers push code and the platform
      handles builds, dependencies, deployment, scaling, etc.
    derived_from: Platform
  SaasPlatform:
    description: |
      SaaS platform node type. Represents platform for renting and
      using a finished application.
    derived_from: Platform
  ServerlessPlatform:
    description: |
      Serverless platform type. Represents a platform that provides
        the ephemeral runtime support for serverless functions, such as
        AWS Lambda, Azure Functions, Google Cloud Functions or OpenFaaS
    derived_from: Platform
