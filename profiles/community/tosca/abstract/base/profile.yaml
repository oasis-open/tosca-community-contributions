tosca_definitions_version: tosca_2_0

profile: community.tosca.abstract.base:0.1

description: >-
  TOSCA Base Profile type definitions. This files contains
  highest-level definitions of abstract types.

imports:
- profile: community.tosca.core:0.1

capability_types:
  # The three base capability types, one for each relationship kind; every
  # other capability type derives from one of them. The technology column
  # declares its own copies in community.tosca.technology.base.
  Container:
    description: >-
      Base capability type for capabilities that can be targeted by a
      ContainedBy relationship.  Advertizes the ability to contain one
      or more other nodes.
    valid_relationship_types: [ContainedBy]
  Feature:
    description: >-
      Base capability type for capabilities that can be targeted by a
      DependsOn relationship. Derived types define
      application-specific functionality.
    valid_relationship_types: [DependsOn]
  Partner:
    description: >-
      Base capability type for capabilities that can be targeted by an
      AssociatesWith relationship.
    valid_relationship_types: [AssociatesWith]
  PlatformHost:
    description: >-
      This capability type is exposed by Platform node types and is
      targeted by HostedOn relationships. It expresses the ability of
      a node template derived from the Platform node type to host
      another platform.
    derived_from: Container
    valid_relationship_types: [HostedOn]
  ExecutionEnvironment:
    description: >-
      This capability type is exposed by Platform node types and is
      targeted by RunsOn relationships. It expresses the ability of a
      node template derived from the Platform node type to provide the
      execution environment for a specific application.
    derived_from: Container
    valid_relationship_types: [RunsOn]
  DataPlatform:
    description: >-
      This capability type is exposed by Platform node types and is
      targeted by AvailableOn relationships. It expresses the ability
      of a node template derived from the Platform node type to host
      data.
    derived_from: Container
    valid_relationship_types: [AvailableOn]
  DataSource:
    description: >-
      This capability type is exposed by Data node types and is
      targeted by Processes relationships. It expresses the ability of
      a node template derived from the Data node type to make
      available data for an application.
    derived_from: Feature
    valid_relationship_types: [Processes]
  Linkable:
    description: >-
      This capability type is exposed by Network node types and is
      targeted by Platform relationships. It expresses the ability of
      a node template derived from the Platform node type to connect
      to a specific network.
    derived_from: Feature
    valid_relationship_types: [LinksTo]
  Service:
    description: >-
      Advertizes the ability to provide a service to other components. Derived
      types carry the contract a consumer reads to use it.
    derived_from: Partner

relationship_types:
  # The three base relationship types, one for each relationship kind. Their
  # relationship_kind values are upper case where the types derived from them
  # below write lower case; I44 settles the convention.
  ContainedBy:
    description: >-
      The ContainedBy type represents a containment relationship
      between two nodes.
    metadata:
      relationship_kind: CONTAINMENT
    valid_capability_types: [Container]
  DependsOn:
    description: >-
      Generic dependency on a feature
    metadata:
      relationship_kind: DEPENDENCY
    valid_capability_types: [Feature]
  AssociatesWith:
    description: >-
      The AssociatesWith type represents an association relationship
      between two nodes.
    metadata:
      relationship_kind: ASSOCIATION
    valid_capability_types: [Partner]
  HostedOn:
    description: >-
      Used for Relationship between nodes derived from the abstract
      Platform node types defined here
    metadata:
      relationship_kind: containment
    derived_from: ContainedBy
    properties:
      implementation-details:
        type: YAML
        required: false
    valid_capability_types: [PlatformHost]
  RunsOn:
    description: >-
      Used for Relationship between nodes derived from the abstract
      Application and Platform node types defined here
    metadata:
      relationship_kind: containment
    derived_from: ContainedBy
    properties:
      implementation-details:
        type: YAML
        required: false
    valid_capability_types: [ExecutionEnvironment]
  AvailableOn:
    description: >-
      Used for Relationship between nodes derived from the abstract
      Data and Platform node types defined here
    metadata:
      relationship_kind: containment
    derived_from: ContainedBy
    properties:
      implementation-details:
        type: YAML
        required: false
    valid_capability_types: [DataPlatform]
  Processes:
    description: >-
      Used for Relationship between nodes derived from the abstract
      Application and Data node types defined here
    metadata:
      relationship_kind: dependency
    derived_from: DependsOn
    properties:
      implementation-details:
        type: YAML
        required: false
    valid_capability_types: [DataSource]
  LinksTo:
    description: >-
      Used for Relationship between nodes derived from the abstract
      Platform and Netork node types defined here
    metadata:
      relationship_kind: dependency
    derived_from: DependsOn
    properties:
      implementation-details:
        type: YAML
        required: false
    valid_capability_types: [Linkable]
  InteractsWith:
    description: >-
      Models interaction between applications: the source uses a service the
      target provides. An association, so it asserts no deployment order.
    metadata:
      relationship_kind: association
    derived_from: AssociatesWith
    valid_capability_types: [Service]

interface_types:
  Standard:
    operations:
      create:
        description: >-
          Operation to create a node.
      modify:
        description: >-
          Operation to modify a node.
      delete:
        description: >-
          Operation to delete a node.
node_types:
  Base:
    description: >-
      Common parent type for all node types in the base profile.
    properties:
      name:
        description: >-
          Name of this node. Every node type carries one, so a realization can
          name the resource it creates after the node it realizes.
        type: string
      technology:
        description: >-
          Technology that is intended to be used in the
          implementation. This property is used to select substitution
          candidates.
        type: string
        required: false
      product:
        description: >-
          Specific product that is intended to be used in the
          implementation. This property is used to select substitution
          candidates.
        type: string
        required: false
      implementation-details:
        description: >-
          Opaque data that are intended to be processed by
          substituting templates.
        type: YAML
        required: false
    interfaces:
      Standard:
        type: Standard
  Platform:
    description: >-
      Abstract Node Type modeling a generic platform, providing resources
      and capabilities to host a running application and/or to store a dataset
    derived_from: Base
    properties:
      # Declared without a vocabulary of kinds: each platform type states the
      # kinds it accepts by refining key_schema, and a refinement's validation
      # adds to the parent's, so the kinds can only be narrowed below here.
      credentials:
        description: >-
          How the orchestrator authenticates to this platform, as references to
          credential material keyed by kind. Supplied for a platform the
          orchestrator connects to; left unset where the realization provisions
          the platform and creates its own access. Derived platform types name
          the kinds they accept.
        type: map
        key_schema:
          type: string
        entry_schema:
          type: CredentialRef
        required: false
    capabilities:
      host:
        type: PlatformHost
      execution-environment:
        type: ExecutionEnvironment
      data-platform:
        type: DataPlatform
    requirements:
      - host:
          capability: PlatformHost
          relationship: HostedOn
      - links-to:
          capability: Linkable
          relationship: LinksTo
  Application:
    description: >-
      Abstract Node Type modeling a generic application
    derived_from: Base
    capabilities:
      service:
        type: Service
    requirements:
      - interacts-with:
          capability: Service
          relationship: InteractsWith
      - processes:
          capability: DataSource
          relationship: Processes
      - runs-on:
          capability: ExecutionEnvironment
          relationship: RunsOn
  Data:
    description: >-
      Abstract Node Type modeling a generic set of data
    derived_from: Base
    capabilities:
      data-source:
        type: DataSource
    requirements:
      - available-on:
          capability: DataPlatform
          relationship: AvailableOn
  Network:
    description: >-
      Abstract Node Type modeling a generic network
    derived_from: Base
    properties:
      cidr_block:
        description: >-
          Address range of this network, in CIDR notation. Left unset for a
          forwarding domain that carries no addressing of its own, or one whose
          range the realization assigns.
        type: string
        required: false
      internet_accessible:
        description: >-
          Whether traffic on this network reaches the public internet. A network
          that does not say so does not.
        type: boolean
        default: false
    capabilities:
      linkable:
        type: Linkable
