tosca_definitions_version: tosca_2_0

profile: community.tosca.abstract.application:0.2

description: >-
  TOSCA Application Profile type definitions. This files contains
  definitions that provide more concrete types derived from
  Application abstract node type

imports:
- profile: community.tosca.core:0.2
- profile: community.tosca.abstract.base:0.2
- profile: community.tosca.abstract.platform:0.2
  namespace: platform

data_types:
  # Used by no type in this profile since N12 removed the property that did.
  # Whether it goes is still open.
  Process:
    description: >-
      This data type provides command and parameters needed to launch
      a single process
    properties:
      command:
        type: string
        required: true
      parameters:
        type: string
        required: false

capability_types:
  # The network specialization of the Service port every Application has.
  Endpoint:
    description: >-
      A service reached over a network, at the address its url gives.
    derived_from: Service
    properties:
      url:
        description: >-
          The URL the service is reached at. Its scheme says how the service
          is reached and its port is the one consumers connect to. Supplied
          with or without a host; the realization populates the full address.
        type: Url
        required: false

node_types:
  ServiceApplication:
    description: >-
      An application that provides a service across the network, reached at
      the address its service capability carries.
    derived_from: Application
    capabilities:
      service:
        type: Endpoint
