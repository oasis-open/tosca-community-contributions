tosca_definitions_version: tosca_2_0

profile: community.tosca.technology.base:0.1

description: >-
  TOSCA Base Profile type definitions. This files contains
  highest-level definitions for technology-specific types. 

imports:
- profile: community.tosca.core:0.1

artifact_types:
  Bash:
    description: >-
      Bash script. If the "host" property is not set, the script is
      run locally. If "host" is set the script is executed on that
      host using an ssh connection.
    mime_type: application/x-sh
    file_ext: [sh]
    properties:
      host:
        type: Socket
        required: false

interface_types:
  Standard:
    operations:
      create:
        description: >-
          Operation to create a node.
      configure:
        description: >-
          Operation to configure a node.
      start:
        description: >-
          Operation to start a node.
      modify:
        description: >-
          Operation to modify a node.
      stop:
        description: >-
          Operation to stop a node.
      delete:
        description: >-
          Operation to delete a node.

relationship_types:
  # The base relationship types for the technology column, one for each
  # relationship kind: the same three community.tosca.abstract.base declares for
  # the System View, so that a technology profile need not import the abstract
  # layer to use them.
  ContainedBy:
    description: >-
      The ContainedBy type represents a containment relationship
      between two nodes.
    metadata:
      relationship_kind: CONTAINMENT
    valid_capability_types: [Container]
  DependsOn:
    description: >-
      Generic dependency on a feature
    metadata:
      relationship_kind: DEPENDENCY
    valid_capability_types: [Feature]
  AssociatesWith:
    description: >-
      The AssociatesWith type represents an association relationship
      between two nodes.
    metadata:
      relationship_kind: ASSOCIATION
    valid_capability_types: [Partner]

capability_types:
  # The capability types the three base relationship types target.
  Container:
    description: >-
      Base capability type for capabilities that can be targeted by a
      ContainedBy relationship.  Advertizes the ability to contain one
      or more other nodes.
    valid_relationship_types: [ContainedBy]
  Feature:
    description: >-
      Base capability type for capabilities that can be targeted by a
      DependsOn relationship. Derived types define
      application-specific functionality.
    valid_relationship_types: [DependsOn]
  Partner:
    description: >-
      Base capability type for capabilities that can be targeted by an
      AssociatesWith relationship.
    valid_relationship_types: [AssociatesWith]

node_types:
  Root:
    description: >-
      Common parent type for all technology-specifc and
      vendor-specific node types.
    interfaces:
      Standard:
        type: Standard
