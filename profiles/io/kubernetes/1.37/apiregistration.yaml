tosca_definitions_version: tosca_2_0
description: Types generated from JSON Schema by any2tosca
imports:
- url: meta.yaml
  namespace: meta
data_types:
  APIServiceCondition:
    description: >-
      APIServiceCondition describes the state of an APIService at a particular point
    properties:
      lastTransitionTime:
        type: meta:Time
        description: >-
          Last time the condition transitioned from one status to another.
        required: false
      message:
        type: string
        description: >-
          Human-readable message indicating details about last transition.
        required: false
      reason:
        type: string
        description: >-
          Unique, one-word, CamelCase reason for the condition's last transition.
        required: false
      status:
        type: string
        description: >-
          Status is the status of the condition. Can be True, False, Unknown.
        required: true
      type:
        type: string
        description: Type is the type of the condition.
        required: true
  APIServiceSpec:
    description: >-
      APIServiceSpec contains information for locating and communicating with a server. Only
      https is supported, though you are able to disable certificate verification.
    properties:
      caBundle:
        type: string
        description: >-
          CABundle is a PEM encoded CA bundle which will be used to validate an API server's
          serving certificate. If unspecified, system trust roots on the apiserver are used.
        required: false
        metadata:
          x-kubernetes-list-type: atomic
      group:
        type: string
        description: Group is the API group name this server hosts
        required: false
      groupPriorityMinimum:
        type: integer
        description: >-
          GroupPriorityMinimum is the priority this group should have at least. Higher priority
          means that the group is preferred by clients over lower priority ones. Note that
          other versions of this group might specify even higher GroupPriorityMinimum values
          such that the whole group gets a higher priority. The primary sort is based on GroupPriorityMinimum,
          ordered highest number to lowest (20 before 10). The secondary sort is based on
          the alphabetical comparison of the name of the object.  (v1.bar before v1.foo) We'd
          recommend something like: *.k8s.io (except extensions) at 18000 and PaaSes (OpenShift,
          Deis) are recommended to be in the 2000s
        required: true
      insecureSkipTLSVerify:
        type: boolean
        description: >-
          InsecureSkipTLSVerify disables TLS certificate verification when communicating with
          this server. This is strongly discouraged.  You should use the CABundle instead.
        required: false
      service:
        type: ServiceReference
        description: >-
          Service is a reference to the service for this API server.  It must communicate
          on port 443. If the Service is nil, that means the handling for the API groupversion
          is handled locally on this server. The call will simply delegate to the normal handler
          chain to be fulfilled.
        required: false
      version:
        type: string
        description: >-
          Version is the API version this server hosts.  For example, "v1"
        required: false
      versionPriority:
        type: integer
        description: >-
          VersionPriority controls the ordering of this API version inside of its group.  Must
          be greater than zero. The primary sort is based on VersionPriority, ordered highest
          to lowest (20 before 10). Since it's inside of a group, the number can be small,
          probably in the 10s. In case of equal version priorities, the version string will
          be used to compute the order inside a group. If the version string is "kube-like",
          it will sort above non "kube-like" version strings, which are ordered lexicographically.
          "Kube-like" versions start with a "v", then are followed by a number (the major
          version), then optionally the string "alpha" or "beta" and another number (the minor
          version). These are sorted first by GA > beta > alpha (where GA is a version with
          no suffix such as beta or alpha), and then by comparing major version, then minor
          version. An example sorted list of versions: v10, v2, v1, v11beta2, v10beta3, v3beta1,
          v12alpha1, v11alpha2, foo1, foo10.
        required: true
  APIServiceStatus:
    description: >-
      APIServiceStatus contains derived information about an API server
    properties:
      conditions:
        type: list
        description: Current service state of apiService.
        required: false
        entry_schema:
          type: APIServiceCondition
        metadata:
          x-kubernetes-list-type: map
          x-kubernetes-list-map-keys: [type]
  ServiceReference:
    description: ServiceReference holds a reference to Service.legacy.k8s.io
    properties:
      name:
        type: string
        description: Name is the name of the service
        required: false
      namespace:
        type: string
        description: Namespace is the namespace of the service
        required: false
      port:
        type: integer
        description: >-
          If specified, the port on the service that hosting webhook. Default to 443 for backward
          compatibility. `port` should be a valid port number (1-65535, inclusive).
        required: false
node_types:
  APIService:
    description: >-
      APIService represents a server for a particular GroupVersion. Name must be "version.group".
    metadata:
      x-kubernetes-group-version-kind:
        group: apiregistration.k8s.io
        kind: APIService
        version: v1
    properties:
      metadata:
        type: meta:ObjectMeta
        description: >-
          Standard object's metadata. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata
        required: false
      spec:
        type: APIServiceSpec
        description: >-
          Spec contains information for locating and communicating with a server
        required: false
    attributes:
      status:
        type: APIServiceStatus
        description: Status contains derived information about an API server
