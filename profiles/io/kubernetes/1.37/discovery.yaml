tosca_definitions_version: tosca_2_0
description: Types generated from JSON Schema by any2tosca
imports:
- url: core.yaml
  namespace: core
- url: meta.yaml
  namespace: meta
data_types:
  Endpoint:
    description: >-
      Endpoint represents a single logical "backend" implementing a service.
    properties:
      addresses:
        type: list
        description: >-
          addresses of this endpoint. For EndpointSlices of addressType "IPv4" or "IPv6",
          the values are IP addresses in canonical form. The syntax and semantics of other
          addressType values are not defined. This must contain at least one address but no
          more than 100. EndpointSlices generated by the EndpointSlice controller will always
          have exactly 1 address. No semantics are defined for additional addresses beyond
          the first, and kube-proxy does not look at them.
        required: true
        entry_schema:
          type: string
        metadata:
          x-kubernetes-list-type: set
      conditions:
        type: EndpointConditions
        description: >-
          conditions contains information about the current status of the endpoint.
        required: false
      deprecatedTopology:
        type: map
        description: >-
          deprecatedTopology contains topology information part of the v1beta1 API. This field
          is deprecated, and will be removed when the v1beta1 API is removed (no sooner than
          kubernetes v1.24).  While this field can hold values, it is not writable through
          the v1 API, and any attempts to write to it will be silently ignored. Topology information
          can be found in the zone and nodeName fields instead.
        required: false
        entry_schema:
          type: string
      hints:
        type: EndpointHints
        description: >-
          hints contains information associated with how an endpoint should be consumed.
        required: false
      hostname:
        type: string
        description: >-
          hostname of this endpoint. This field may be used by consumers of endpoints to distinguish
          endpoints from each other (e.g. in DNS names). Multiple endpoints which use the
          same hostname should be considered fungible (e.g. multiple A values in DNS). Must
          be lowercase and pass DNS Label (RFC 1123) validation.
        required: false
      nodeName:
        type: string
        description: >-
          nodeName represents the name of the Node hosting this endpoint. This can be used
          to determine endpoints local to a Node.
        required: false
      targetRef:
        type: core:ObjectReference
        description: >-
          targetRef is a reference to a Kubernetes object that represents this endpoint.
        required: false
      zone:
        type: string
        description: zone is the name of the Zone this endpoint exists in.
        required: false
  EndpointConditions:
    description: >-
      EndpointConditions represents the current condition of an endpoint.
    properties:
      ready:
        type: boolean
        description: >-
          ready indicates that this endpoint is ready to receive traffic, according to whatever
          system is managing the endpoint. A nil value should be interpreted as "true". In
          general, an endpoint should be marked ready if it is serving and not terminating,
          though this can be overridden in some cases, such as when the associated Service
          has set the publishNotReadyAddresses flag.
        required: false
      serving:
        type: boolean
        description: >-
          serving indicates that this endpoint is able to receive traffic, according to whatever
          system is managing the endpoint. For endpoints backed by pods, the EndpointSlice
          controller will mark the endpoint as serving if the pod's Ready condition is True.
          A nil value should be interpreted as "true".
        required: false
      terminating:
        type: boolean
        description: >-
          terminating indicates that this endpoint is terminating. A nil value should be interpreted
          as "false".
        required: false
  EndpointHints:
    description: >-
      EndpointHints provides hints describing how an endpoint should be consumed.
    properties:
      forNodes:
        type: list
        description: >-
          forNodes indicates the node(s) this endpoint should be consumed by when using topology
          aware routing. May contain a maximum of 8 entries.
        required: false
        entry_schema:
          type: ForNode
        metadata:
          x-kubernetes-list-type: atomic
      forZones:
        type: list
        description: >-
          forZones indicates the zone(s) this endpoint should be consumed by when using topology
          aware routing. May contain a maximum of 8 entries.
        required: false
        entry_schema:
          type: ForZone
        metadata:
          x-kubernetes-list-type: atomic
  EndpointPort:
    description: EndpointPort represents a Port used by an EndpointSlice
    metadata:
      x-kubernetes-map-type: atomic
    properties:
      appProtocol:
        type: string
        description: >-
          The application protocol for this port. This is used as a hint for implementations
          to offer richer behavior for protocols that they understand. This field follows
          standard Kubernetes label syntax. Valid values are either:


          * Un-prefixed protocol names - reserved for IANA standard service names (as per
          RFC-6335 and https://www.iana.org/assignments/service-names).


          * Kubernetes-defined prefixed names:
            * 'kubernetes.io/h2c' - HTTP/2 prior knowledge over cleartext as described
          in https://www.rfc-editor.org/rfc/rfc9113.html#name-starting-http-2-with-prior-
            * 'kubernetes.io/ws'  - WebSocket over cleartext as described in https://www.rfc-editor.org/rfc/rfc6455
            * 'kubernetes.io/wss' - WebSocket over TLS as described in https://www.rfc-editor.org/rfc/rfc6455

          * Other protocols should use implementation-defined prefixed names such as mycompany.com/my-custom-protocol.
        required: false
      name:
        type: string
        description: >-
          name represents the name of this port. All ports in an EndpointSlice must have a
          unique name. If the EndpointSlice is derived from a Kubernetes service, this corresponds
          to the Service.ports[].name. Name must either be an empty string or pass DNS_LABEL
          validation: * must be no more than 63 characters long. * must consist of lower case
          alphanumeric characters or '-'. * must start and end with an alphanumeric character.
          Default is empty string.
        required: false
      port:
        type: integer
        description: >-
          port represents the port number of the endpoint. If the EndpointSlice is derived
          from a Kubernetes service, this must be set to the service's target port. EndpointSlices
          used for other purposes may have a nil port.
        required: false
      protocol:
        type: string
        description: >-
          protocol represents the IP protocol for this port. Must be UDP, TCP, or SCTP. Default
          is TCP.
        required: false
  ForNode:
    description: >-
      ForNode provides information about which nodes should consume this endpoint.
    properties:
      name:
        type: string
        description: name represents the name of the node.
        required: true
  ForZone:
    description: >-
      ForZone provides information about which zones should consume this endpoint.
    properties:
      name:
        type: string
        description: name represents the name of the zone.
        required: true
node_types:
  EndpointSlice:
    description: >-
      EndpointSlice represents a set of service endpoints. Most EndpointSlices are created
      by the EndpointSlice controller to represent the Pods selected by Service objects. For
      a given service there may be multiple EndpointSlice objects which must be joined to
      produce the full set of endpoints; you can find all of the slices for a given service
      by listing EndpointSlices in the service's namespace whose `kubernetes.io/service-name`
      label contains the service's name.
    metadata:
      x-kubernetes-group-version-kind:
        group: discovery.k8s.io
        kind: EndpointSlice
        version: v1
    properties:
      addressType:
        type: string
        description: >-
          addressType specifies the type of address carried by this EndpointSlice. All addresses
          in this slice must be the same type. This field is immutable after creation. The
          following address types are currently supported: * IPv4: Represents an IPv4 Address.
          * IPv6: Represents an IPv6 Address. * FQDN: Represents a Fully Qualified Domain
          Name. (Deprecated) The EndpointSlice controller only generates, and kube-proxy only
          processes, slices of addressType "IPv4" and "IPv6". No semantics are defined for
          the "FQDN" type.
        required: true
      endpoints:
        type: list
        description: >-
          endpoints is a list of unique endpoints in this slice. Each slice may include a
          maximum of 1000 endpoints.
        required: false
        entry_schema:
          type: Endpoint
        metadata:
          x-kubernetes-list-type: atomic
      metadata:
        type: meta:ObjectMeta
        description: Standard object's metadata.
        required: false
      ports:
        type: list
        description: >-
          ports specifies the list of network ports exposed by each endpoint in this slice.
          Each port must have a unique name. Each slice may include a maximum of 100 ports.
          Services always have at least 1 port, so EndpointSlices generated by the EndpointSlice
          controller will likewise always have at least 1 port. EndpointSlices used for other
          purposes may have an empty ports list.
        required: false
        entry_schema:
          type: EndpointPort
        metadata:
          x-kubernetes-list-type: atomic
