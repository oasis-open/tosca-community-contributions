relationship_types:
  Exposes:
    description: >-
      Relationship type for specifying the workload that is being exposed by a service
    derived_from: base:DependsOn
    valid_capability_types: [Workload]
  Controls:
    description: >-
      Relationship type for specifying the workload that is being controlled by a workload
      controller
    derived_from: base:DependsOn
    valid_capability_types: [Workload]
  RunsAs:
    description: Relationship type for specifying the identity of a workload
    derived_from: base:DependsOn
    valid_capability_types: [Identity]
  ScopedBy:
    description: Relationship type for specifying the namespace of a resource
    derived_from: base:ContainedBy
    valid_capability_types: [Scope]
node_types:
  StandalonePod:
    description: >-
      A Standalone Pod is intended to be deployed without a controller
    derived_from: BasePod
    interfaces:
      standard:
        operations:
          create:
            inputs:
              spec: {$get_property: [SELF, spec]}
            outputs:
              spec: [SELF, spec]
              status: [SELF, status]
            implementation:
              primary:
                file: artifacts/standalone_pod/create.sh
                type: base:Bash
          delete:
            implementation:
              primary:
                file: artifacts/standalone_pod/delete.sh
                type: base:Bash
  BasePod:
    description: >-
      Pod is a collection of containers that can run on a host. This resource is created by
      clients and scheduled onto hosts.
    derived_from: NamespacedResource
    metadata:
      x-kubernetes-group-version-kind:
        group: {}
        kind: Pod
        version: v1
    properties:
      spec:
        description: >-
          Specification of the desired behavior of the pod. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status
        type: PodSpec
    attributes:
      status:
        description: >-
          Most recently observed status of the pod. This data may not be up to date. Populated
          by the system. Read-only. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status
        type: PodStatus
    requirements:
    - runsAs:
        count_range: [0, 1]
        capability: Identity
        node: ServiceAccount
        relationship: RunsAs
  NamespacedResource:
    description: >-
      Base class for resources that are scoped to a specific Kubernetes namespace. If the
      relationship to a Namespace node is missing, the default namespace will be used.
    derived_from: Resource
    properties:
      metadata:
        properties:
          namespace:
            value: {$get_property: [SELF, RELATIONSHIP, namespace, TARGET, metadata, name]}
    requirements:
    - namespace:
        capability: Scope
        relationship: ScopedBy
        node: Namespace
        count_range: [0, 1]
  Resource:
    description: Base class for Kubernetes resources
    derived_from: base:Root
    properties:
      metadata:
        description: >-
          Standard object's metadata. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata
        type: meta:ObjectMeta
    requirements:
    - cluster:
        capability: base:Kubernetes
        node: base:KubernetesCluster
        relationship: base:ContainedBy
        count_range: [1, 1]
    interfaces:
      standard:
        inputs:
          kubeconfig: {$get_attribute: [SELF, RELATIONSHIP, cluster, TARGET, kubeconfig]}
          context:
            type: string
            required: false
          metadata: {$get_property: [SELF, metadata]}
  ConfigMap:
    description: ConfigMap holds configuration data for pods to consume.
    derived_from: NamespacedResource
    metadata:
      x-kubernetes-group-version-kind:
        group: ''
        kind: ConfigMap
        version: v1
    properties:
      binaryData:
        type: map
        description: >-
          BinaryData contains the binary data. Each key must consist of alphanumeric characters,
          '-', '_' or '.'. BinaryData can contain byte sequences that are not in the UTF-8
          range. The keys stored in BinaryData must not overlap with the ones in the Data
          field, this is enforced during validation process. Using this field will require
          1.10+ apiserver and kubelet. Note: BinaryData keys are not currently propagated
          to container env vars via ConfigMapKeyRef or ConfigMapRef env sources; only Data
          keys are used.
        required: false
        entry_schema:
          type: string
      data:
        type: map
        description: >-
          Data contains the configuration data. Each key must consist of alphanumeric characters,
          '-', '_' or '.'. Values with non-UTF-8 byte sequences must use the BinaryData field.
          The keys stored in Data must not overlap with the keys in the BinaryData field,
          this is enforced during validation process.
        required: false
        entry_schema:
          type: string
      immutable:
        type: boolean
        description: >-
          Immutable, if set to true, ensures that data stored in the ConfigMap cannot be updated
          (only object metadata can be modified). If not set to true, the field can be modified
          at any time. Defaulted to nil.
        required: false
  Endpoints:
    description: "Endpoints is a collection of endpoints that implement the actual service.\
      \ Example:\n\n\t Name: \"mysvc\",\n\t Subsets: [\n\t   {\n\t     Addresses: [{\"ip\"\
      : \"10.10.1.1\"}, {\"ip\": \"10.10.2.2\"}],\n\t     Ports: [{\"name\": \"a\", \"port\"\
      : 8675}, {\"name\": \"b\", \"port\": 309}]\n\t   },\n\t   {\n\t     Addresses: [{\"\
      ip\": \"10.10.3.3\"}],\n\t     Ports: [{\"name\": \"a\", \"port\": 93}, {\"name\": \"\
      b\", \"port\": 76}]\n\t   },\n\t]\n\nEndpoints is a legacy API and does not contain\
      \ information about all Service features. Use discoveryv1.EndpointSlice for complete\
      \ information about Service endpoints.\n\nDeprecated: This API is deprecated in v1.33+.\
      \ Use discoveryv1.EndpointSlice."
    derived_from: NamespacedResource
    metadata:
      x-kubernetes-group-version-kind:
        group: ''
        kind: Endpoints
        version: v1
    properties:
      subsets:
        type: list
        description: >-
          The set of all endpoints is the union of all subsets. Addresses are placed into
          subsets according to the IPs they share. A single address with multiple ports, some
          of which are ready and some of which are not (because they come from different containers)
          will result in the address being displayed in different subsets for the different
          ports. No address will appear in both Addresses and NotReadyAddresses in the same
          subset. Sets of addresses and ports that comprise a service.
        required: false
        entry_schema:
          type: EndpointSubset
        metadata:
          x-kubernetes-list-type: atomic
  Event:
    description: >-
      Event is a report of an event somewhere in the cluster.  Events have a limited retention
      time and triggers and messages may evolve with time.  Event consumers should not rely
      on the timing of an event with a given Reason reflecting a consistent underlying trigger,
      or the continued existence of events with that Reason.  Events should be treated as
      informative, best-effort, supplemental data.
    derived_from: NamespacedResource
    metadata:
      x-kubernetes-group-version-kind:
        group: ''
        kind: Event
        version: v1
    properties:
      action:
        type: string
        description: >-
          What action was taken/failed regarding to the Regarding object.
        required: false
      count:
        type: integer
        description: The number of times this event has occurred.
        required: false
      eventTime:
        type: meta:MicroTime
        description: Time when this Event was first observed.
        required: false
      firstTimestamp:
        type: meta:Time
        description: >-
          The time at which the event was first recorded. (Time of server receipt is in TypeMeta.)
        required: false
      involvedObject:
        type: ObjectReference
        description: The object that this event is about.
        required: true
      lastTimestamp:
        type: meta:Time
        description: >-
          The time at which the most recent occurrence of this event was recorded.
        required: false
      message:
        type: string
        description: >-
          A human-readable description of the status of this operation.
        required: false
      reason:
        type: string
        description: >-
          This should be a short, machine understandable string that gives the reason for
          the transition into the object's current status.
        required: false
      related:
        type: ObjectReference
        description: Optional secondary object for more complex actions.
        required: false
      reportingComponent:
        type: string
        description: >-
          Name of the controller that emitted this Event, e.g. `kubernetes.io/kubelet`.
        required: false
      reportingInstance:
        type: string
        description: ID of the controller instance, e.g. `kubelet-xyzf`.
        required: false
      series:
        type: EventSeries
        description: >-
          Data about the Event series this event represents or nil if it's a singleton Event.
        required: false
      source:
        type: EventSource
        description: >-
          The component reporting this event. Should be a short machine understandable string.
        required: false
      type:
        type: string
        description: >-
          Type of this event (Normal, Warning), new types could be added in the future
        required: false
  LimitRange:
    description: >-
      LimitRange sets resource usage limits for each kind of resource in a Namespace.
    derived_from: NamespacedResource
    metadata:
      x-kubernetes-group-version-kind:
        group: ''
        kind: LimitRange
        version: v1
    properties:
      spec:
        type: LimitRangeSpec
        description: >-
          Spec defines the limits enforced. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status
        required: false
  Namespace:
    description: >-
      Namespace provides a scope for Names. Use of multiple namespaces is optional.
    derived_from: Resource
    metadata:
      x-kubernetes-group-version-kind:
        group: ''
        kind: Namespace
        version: v1
    properties:
      spec:
        type: NamespaceSpec
        description: >-
          Spec defines the behavior of the Namespace. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status
        required: false
    attributes:
      status:
        type: NamespaceStatus
        description: >-
          Status describes the current status of a Namespace. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status
    capabilities:
      scope:
        type: Scope
    interfaces:
      standard:
        operations:
          create:
            inputs:
              spec: {$get_property: [SELF, spec]}
            outputs:
              spec: [SELF, spec]
              status: [SELF, status]
            implementation:
              primary:
                file: artifacts/namespace/create.sh
                type: base:Bash
          delete:
            implementation:
              primary:
                file: artifacts/namespace/delete.sh
                type: base:Bash
  Node:
    description: >-
      Node is a worker node in Kubernetes. Each node will have a unique identifier in the
      cache (i.e. in etcd).
    derived_from: Resource
    metadata:
      x-kubernetes-group-version-kind:
        group: ''
        kind: Node
        version: v1
    properties:
      spec:
        type: NodeSpec
        description: >-
          Spec defines the behavior of a node. https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status
        required: false
    attributes:
      status:
        type: NodeStatus
        description: >-
          Most recently observed status of the node. Populated by the system. Read-only. More
          info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status
  PersistentVolume:
    description: >-
      PersistentVolume (PV) is a storage resource provisioned by an administrator. It is analogous
      to a node. More info: https://kubernetes.io/docs/concepts/storage/persistent-volumes
    derived_from: Resource
    metadata:
      x-kubernetes-group-version-kind:
        group: ''
        kind: PersistentVolume
        version: v1
    properties:
      spec:
        type: PersistentVolumeSpec
        description: >-
          spec defines a specification of a persistent volume owned by the cluster. Provisioned
          by an administrator. More info: https://kubernetes.io/docs/concepts/storage/persistent-volumes#persistent-volumes
        required: false
    attributes:
      status:
        type: PersistentVolumeStatus
        description: >-
          status represents the current information/status for the persistent volume. Populated
          by the system. Read-only. More info: https://kubernetes.io/docs/concepts/storage/persistent-volumes#persistent-volumes
  PersistentVolumeClaim:
    description: >-
      PersistentVolumeClaim is a user's request for and claim to a persistent volume
    derived_from: NamespacedResource
    metadata:
      x-kubernetes-group-version-kind:
        group: ''
        kind: PersistentVolumeClaim
        version: v1
    properties:
      spec:
        type: PersistentVolumeClaimSpec
        description: >-
          spec defines the desired characteristics of a volume requested by a pod author.
          More info: https://kubernetes.io/docs/concepts/storage/persistent-volumes#persistentvolumeclaims
        required: false
    attributes:
      status:
        type: PersistentVolumeClaimStatus
        description: >-
          status represents the current information/status of a persistent volume claim. Read-only.
          More info: https://kubernetes.io/docs/concepts/storage/persistent-volumes#persistentvolumeclaims
  Pod:
    description: >-
      Pod is a collection of containers that can run on a host. This resource is created by
      clients and scheduled onto hosts.
    derived_from: BasePod
    metadata:
      x-kubernetes-group-version-kind:
        group: ''
        kind: Pod
        version: v1
    properties:
      metadata:
        properties:
          labels:
            required: true
    capabilities:
      pod: Workload
  PodTemplate:
    description: >-
      PodTemplate describes a template for creating copies of a predefined pod.
    derived_from: NamespacedResource
    metadata:
      x-kubernetes-group-version-kind:
        group: ''
        kind: PodTemplate
        version: v1
    properties:
      template:
        type: PodTemplateSpec
        description: >-
          Template defines the pods that will be created from this pod template. https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status
        required: false
  ReplicationController:
    description: >-
      ReplicationController represents the configuration of a replication controller.
    derived_from: NamespacedResource
    metadata:
      x-kubernetes-group-version-kind:
        group: ''
        kind: ReplicationController
        version: v1
    properties:
      spec:
        type: ReplicationControllerSpec
        description: >-
          Spec defines the specification of the desired behavior of the replication controller.
          More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status
        required: false
    attributes:
      status:
        type: ReplicationControllerStatus
        description: >-
          Status is the most recently observed status of the replication controller. This
          data may be out of date by some window of time. Populated by the system. Read-only.
          More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status
  ResourceQuota:
    description: >-
      ResourceQuota sets aggregate quota restrictions enforced per namespace
    derived_from: NamespacedResource
    metadata:
      x-kubernetes-group-version-kind:
        group: ''
        kind: ResourceQuota
        version: v1
    properties:
      spec:
        type: ResourceQuotaSpec
        description: >-
          Spec defines the desired quota. https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status
        required: false
    attributes:
      status:
        type: ResourceQuotaStatus
        description: >-
          Status defines the actual enforced quota and its current usage. https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status
  Secret:
    description: >-
      Secret holds secret data of a certain type. The total bytes of the values in the Data
      field must be less than MaxSecretSize bytes.
    derived_from: NamespacedResource
    metadata:
      x-kubernetes-group-version-kind:
        group: ''
        kind: Secret
        version: v1
    properties:
      data:
        type: map
        description: >-
          Data contains the secret data. Each key must consist of alphanumeric characters,
          '-', '_' or '.'. The serialized form of the secret data is a base64 encoded string,
          representing the arbitrary (possibly non-string) data value here. Described in https://tools.ietf.org/html/rfc4648#section-4
        required: false
        entry_schema:
          type: string
      immutable:
        type: boolean
        description: >-
          Immutable, if set to true, ensures that data stored in the Secret cannot be updated
          (only object metadata can be modified). If not set to true, the field can be modified
          at any time. Defaulted to nil.
        required: false
      stringData:
        type: map
        description: >-
          stringData allows specifying non-binary secret data in string form. It is provided
          as a write-only input field for convenience. All keys and values are merged into
          the data field on write, overwriting any existing values. The stringData field is
          never output when reading from the API.
        required: false
        entry_schema:
          type: string
      type:
        type: string
        description: >-
          Used to facilitate programmatic handling of secret data. More info: https://kubernetes.io/docs/concepts/configuration/secret/#secret-types
        required: false
  Service:
    description: >-
      Service is a named abstraction of software service (for example, mysql) consisting of
      local port (for example 3306) that the proxy listens on, and the selector that determines
      which pods will answer requests sent through the proxy.
    derived_from: NamespacedResource
    metadata:
      x-kubernetes-group-version-kind:
        group: ''
        kind: Service
        version: v1
    properties:
      spec:
        description: >-
          Spec defines the behavior of a service. https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status
        type: ServiceSpec
        properties:
          selector:
            default: {$get_property: [SELF, RELATIONSHIP, pod, TARGET, metadata, labels]}
    attributes:
      status:
        type: ServiceStatus
        description: >-
          Most recently observed status of the service. Populated by the system. Read-only.
          More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status
    requirements:
    - pod:
        capability: Workload
        relationship: Exposes
        node: Pod
        count_range: [1, 1]
    interfaces:
      standard:
        operations:
          create:
            inputs:
              spec: {$get_property: [SELF, spec]}
            outputs:
              spec: [SELF, spec]
              status: [SELF, status]
            implementation:
              primary:
                file: artifacts/service/create.sh
                type: base:Bash
          delete:
            implementation:
              primary:
                file: artifacts/service/delete.sh
                type: base:Bash
  ServiceAccount:
    description: >-
      ServiceAccount binds together: * a name, understood by users, and perhaps by peripheral
      systems, for an identity * a principal that can be authenticated and authorized * a
      set of secrets
    derived_from: NamespacedResource
    metadata:
      x-kubernetes-group-version-kind:
        group: ''
        kind: ServiceAccount
        version: v1
    properties:
      automountServiceAccountToken:
        type: boolean
        description: >-
          AutomountServiceAccountToken indicates whether pods running as this service account
          should have an API token automatically mounted. Can be overridden at the pod level.
        required: false
      imagePullSecrets:
        type: list
        description: >-
          ImagePullSecrets is a list of references to secrets in the same namespace to use
          for pulling any images in pods that reference this ServiceAccount. ImagePullSecrets
          are distinct from Secrets because Secrets can be mounted in the pod, but ImagePullSecrets
          are only accessed by the kubelet. More info: https://kubernetes.io/docs/concepts/containers/images/#specifying-imagepullsecrets-on-a-pod
        required: false
        entry_schema:
          type: LocalObjectReference
        metadata:
          x-kubernetes-list-type: atomic
      secrets:
        type: list
        description: >-
          Secrets is a list of the secrets in the same namespace that pods running using this
          ServiceAccount are allowed to use. Pods are only limited to this list if this service
          account has a "kubernetes.io/enforce-mountable-secrets" annotation set to "true".
          The "kubernetes.io/enforce-mountable-secrets" annotation is deprecated since v1.32.
          Prefer separate namespaces to isolate access to mounted secrets. This field should
          not be used to find auto-generated service account token secrets for use outside
          of pods. Instead, tokens can be requested directly using the TokenRequest API, or
          service account token secrets can be manually created. More info: https://kubernetes.io/docs/concepts/configuration/secret
        required: false
        entry_schema:
          type: ObjectReference
        metadata:
          x-kubernetes-list-type: map
          x-kubernetes-list-map-keys: [name]
    capabilities:
      identity: Identity
    interfaces:
      standard:
        operations:
          create:
            inputs:
              automountServiceAccountToken: {$get_property: [SELF, automountServiceAccountToken]}
              imagePullSecrets: {$get_property: [SELF, imagePullSecrets]}
              secrets: {$get_property: [SELF, secrets]}
            outputs:
              automountServiceAccountToken:
                mapping: [SELF, automountServiceAccountToken]
                required: false
              imagePullSecrets:
                mapping: [SELF, imagePullSecrets]
                required: false
              secrets:
                mapping: [SELF, secrets]
                required: false
            implementation:
              primary:
                file: artifacts/service_account/create.sh
                type: base:Bash
          delete:
            implementation:
              primary:
                file: artifacts/service_account/delete.sh
                type: base:Bash
