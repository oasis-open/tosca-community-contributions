          lastTransitionTime is when the current set of conditions first appeared.
        required: false
  VolumeMount:
    description: >-
      VolumeMount describes a mounting of a Volume within a container.
    properties:
      bindMountOptions:
        type: list
        description: >-
          bindMountOptions is the list of additional bind mount options to apply when mounting
          this volume into the container. Allowed values are noexec, nodev, and nosuid. These
          are Linux mount options and have no effect on Windows nodes. This field is not supported
          with image volumes. This is an alpha field and requires enabling the VolumeBindMountOptions
          feature gate.
        required: false
        entry_schema:
          type: string
        metadata:
          x-kubernetes-list-type: set
      mountPath:
        type: string
        description: >-
          Path within the container at which the volume should be mounted.
        required: true
      mountPropagation:
        type: string
        description: >-
          mountPropagation determines how mounts are propagated from the host to container
          and the other way around. When not set, MountPropagationNone is used. This field
          is beta in 1.10. When RecursiveReadOnly is set to IfPossible or to Enabled, MountPropagation
          must be None or unspecified (which defaults to None).
        required: false
      name:
        type: string
        description: This must match the Name of a Volume.
        required: true
      readOnly:
        type: boolean
        description: >-
          Mounted read-only if true, read-write otherwise (false or unspecified). Defaults
          to false.
        required: false
      recursiveReadOnly:
        type: string
        description: >-
          RecursiveReadOnly specifies whether read-only mounts should be handled recursively.


          If ReadOnly is false, this field has no meaning and must be unspecified.


          If ReadOnly is true, and this field is set to Disabled, the mount is not made recursively
          read-only.  If this field is set to IfPossible, the mount is made recursively read-only,
          if it is supported by the container runtime.  If this field is set to Enabled, the
          mount is made recursively read-only if it is supported by the container runtime,
          otherwise the pod will not be started and an error will be generated to indicate
          the reason.


          If this field is set to IfPossible or Enabled, MountPropagation must be set to None
          (or be unspecified, which defaults to None).


          If this field is not specified, it is treated as an equivalent of Disabled.
        required: false
      subPath:
        type: string
        description: >-
          Path within the volume from which the container's volume should be mounted. Defaults
          to "" (volume's root).
        required: false
      subPathExpr:
        type: string
        description: >-
          Expanded path within the volume from which the container's volume should be mounted.
          Behaves similarly to SubPath but environment variable references $(VAR_NAME) are
          expanded using the container's environment. Defaults to "" (volume's root). SubPathExpr
          and SubPath are mutually exclusive.
        required: false
