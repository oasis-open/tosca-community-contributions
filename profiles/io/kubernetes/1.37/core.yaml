    description: VolumeMountStatus shows status of volume mounts.
    properties:
      mountPath:
        type: string
        description: MountPath corresponds to the original VolumeMount.
        required: true
      name:
        type: string
        description: Name corresponds to the name of the original VolumeMount.
        required: true
      readOnly:
        type: boolean
        description: ReadOnly corresponds to the original VolumeMount.
        required: false
      recursiveReadOnly:
        type: string
        description: >-
          RecursiveReadOnly must be set to Disabled, Enabled, or unspecified (for non-readonly
          mounts). An IfPossible value in the original VolumeMount must be translated to Disabled
          or Enabled, depending on the mount result.
        required: false
      volumeStatus:
        type: VolumeStatus
        description: >-
          volumeStatus represents volume-type-specific status about the mounted volume.
        required: false
