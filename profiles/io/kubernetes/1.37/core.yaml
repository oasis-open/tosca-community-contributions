        description: required specifies hard node constraints that must be met.
        required: false
  VolumeProjection:
    description: >-
      Projection that may be projected along with other supported volume types. Exactly one
      of these fields must be set.
    properties:
      clusterTrustBundle:
        type: ClusterTrustBundleProjection
        description: >-
          ClusterTrustBundle allows a pod to access the `.spec.trustBundle` field of ClusterTrustBundle
          objects in an auto-updating file.


          Alpha, gated by the ClusterTrustBundleProjection feature gate.


          ClusterTrustBundle objects can either be selected by name, or by the combination
          of signer name and a label selector.


          Kubelet performs aggressive normalization of the PEM contents written into the pod
          filesystem.  Esoteric PEM features such as inter-block comments and block headers
          are stripped.  Certificates are deduplicated. The ordering of certificates within
          the file is arbitrary, and Kubelet may change the order over time.
        required: false
      configMap:
        type: ConfigMapProjection
        description: configMap information about the configMap data to project
        required: false
      downwardAPI:
        type: DownwardAPIProjection
        description: >-
          downwardAPI information about the downwardAPI data to project
        required: false
      podCertificate:
        type: PodCertificateProjection
        description: >-
          Projects an auto-rotating credential bundle (private key and certificate chain)
          that the pod can use either as a TLS client or server.


          Kubelet generates a private key and uses it to send a PodCertificateRequest to the
          named signer.  Once the signer approves the request and issues a certificate chain,
          Kubelet writes the key and certificate chain to the pod filesystem.  The pod does
          not start until certificates have been issued for each podCertificate projected
          volume source in its spec.


          Kubelet will begin trying to rotate the certificate at the time indicated by the
          signer using the PodCertificateRequest.Status.BeginRefreshAt timestamp.


          Kubelet can write a single file, indicated by the credentialBundlePath field, or
          separate files, indicated by the keyPath and certificateChainPath fields.


          The credential bundle is a single file in PEM format.  The first PEM entry is the
          private key (in PKCS#8 format), and the remaining PEM entries are the certificate
          chain issued by the signer (typically, signers will return their certificate chain
          in leaf-to-root order).


          Prefer using the credential bundle format, since your application code can read
          it atomically.  If you use keyPath and certificateChainPath, your application must
          make two separate file reads. If these coincide with a certificate rotation, it
          is possible that the private key and leaf certificate you read may not correspond
          to each other.  Your application will need to check for this condition, and re-read
          until they are consistent.


          The named signer controls chooses the format of the certificate it issues; consult
          the signer implementation's documentation to learn how to use the certificates it
          issues.
        required: false
      secret:
        type: SecretProjection
        description: secret information about the secret data to project
        required: false
      serviceAccountToken:
        type: ServiceAccountTokenProjection
        description: >-
          serviceAccountToken is information about the serviceAccountToken data to project
        required: false
  VolumeResourceRequirements:
    description: >-
      VolumeResourceRequirements describes the storage resource requirements for a volume.
    properties:
      limits:
        type: map
        description: >-
          Limits describes the maximum amount of compute resources allowed. More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        required: false
        entry_schema:
          type: resource:Quantity
      requests:
        type: map
        description: >-
          Requests describes the minimum amount of compute resources required. If Requests
          is omitted for a container, it defaults to Limits if that is explicitly specified,
          otherwise to an implementation-defined value. Requests cannot exceed Limits. More
          info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        required: false
        entry_schema:
          type: resource:Quantity
  VolumeStatus:
    description: >-
      VolumeStatus represents the status of a mounted volume. At most one of its members must
      be specified.
    properties:
      image:
        type: ImageVolumeStatus
        description: >-
          image represents an OCI object (a container image or artifact) pulled and mounted
          on the kubelet's host machine.
        required: false
  VsphereVirtualDiskVolumeSource:
    description: Represents a vSphere volume resource.
    properties:
      fsType:
        type: string
        description: >-
          fsType is filesystem type to mount. Must be a filesystem type supported by the host
          operating system. Ex. "ext4", "xfs", "ntfs". Implicitly inferred to be "ext4" if
          unspecified.
        required: false
      storagePolicyID:
        type: string
        description: >-
          storagePolicyID is the storage Policy Based Management (SPBM) profile ID associated
          with the StoragePolicyName.
        required: false
      storagePolicyName:
        type: string
        description: >-
          storagePolicyName is the storage Policy Based Management (SPBM) profile name.
        required: false
      volumePath:
        type: string
        description: volumePath is the path that identifies vSphere volume vmdk
        required: true
  WeightedPodAffinityTerm:
    description: >-
      The weights of all of the matched WeightedPodAffinityTerm fields are added per-node
      to find the most preferred node(s)
    properties:
      podAffinityTerm:
        type: PodAffinityTerm
        description: >-
          Required. A pod affinity term, associated with the corresponding weight.
        required: true
      weight:
        type: integer
        description: >-
          weight associated with matching the corresponding podAffinityTerm, in the range
          1-100.
        required: true
  WindowsSecurityContextOptions:
    description: >-
      WindowsSecurityContextOptions contain Windows-specific options and credentials.
    properties:
      gmsaCredentialSpec:
        type: string
        description: >-
          GMSACredentialSpec is where the GMSA admission webhook (https://github.com/kubernetes-sigs/windows-gmsa)
          inlines the contents of the GMSA credential spec named by the GMSACredentialSpecName
          field.
        required: false
      gmsaCredentialSpecName:
        type: string
        description: >-
          GMSACredentialSpecName is the name of the GMSA credential spec to use.
        required: false
      hostProcess:
        type: boolean
        description: >-
          HostProcess determines if a container should be run as a 'Host Process' container.
          All of a Pod's containers must have the same effective HostProcess value (it is
          not allowed to have a mix of HostProcess containers and non-HostProcess containers).
          In addition, if HostProcess is true then HostNetwork must also be set to true.
        required: false
      runAsUserName:
        type: string
        description: >-
          The UserName in Windows to run the entrypoint of the container process. Defaults
          to the user specified in image metadata if unspecified. May also be set in PodSecurityContext.
          If set in both SecurityContext and PodSecurityContext, the value specified in SecurityContext
          takes precedence.
        required: false
  PersistentVolumeClaimValue:
    description: >-
      PersistentVolumeClaim is a user's request for and claim to a persistent volume
    metadata:
      x-kubernetes-group-version-kind:
        group: ''
        kind: PersistentVolumeClaim
        version: v1
    properties:
      metadata:
        type: meta:ObjectMeta
        description: >-
          Standard object's metadata. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata
        required: false
      spec:
        type: PersistentVolumeClaimSpec
        description: >-
          spec defines the desired characteristics of a volume requested by a pod author.
          More info: https://kubernetes.io/docs/concepts/storage/persistent-volumes#persistentvolumeclaims
        required: false
      status:
        type: PersistentVolumeClaimStatus
        description: >-
          status represents the current information/status of a persistent volume claim. Read-only.
          More info: https://kubernetes.io/docs/concepts/storage/persistent-volumes#persistentvolumeclaims
        required: false
