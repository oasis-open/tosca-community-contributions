tosca_definitions_version: tosca_2_0
description: Types generated from JSON Schema by any2tosca
imports:
- profile: community.tosca.technology.base:0.2
  namespace: base
- url: meta.yaml
  namespace: meta
- url: resource.yaml
  namespace: resource
- url: intstr.yaml
  namespace: intstr
data_types:
  AWSElasticBlockStoreVolumeSource:
    description: >-
      Represents a Persistent Disk resource in AWS.


      An AWS EBS disk must exist before mounting to a container. The disk must also be in
      the same AWS zone as the kubelet. An AWS EBS disk can only be mounted as read/write
      once. AWS EBS volumes support ownership management and SELinux relabeling.
    properties:
      fsType:
        type: string
        description: >-
          fsType is the filesystem type of the volume that you want to mount. Tip: Ensure
          that the filesystem type is supported by the host operating system. Examples: "ext4",
          "xfs", "ntfs". Implicitly inferred to be "ext4" if unspecified. More info: https://kubernetes.io/docs/concepts/storage/volumes#awselasticblockstore
        required: false
      partition:
        type: integer
        description: >-
          partition is the partition in the volume that you want to mount. If omitted, the
          default is to mount by volume name. Examples: For volume /dev/sda1, you specify
          the partition as "1". Similarly, the volume partition for /dev/sda is "0" (or you
          can leave the property empty).
        required: false
      readOnly:
        type: boolean
        description: >-
          readOnly value true will force the readOnly setting in VolumeMounts. More info:
          https://kubernetes.io/docs/concepts/storage/volumes#awselasticblockstore
        required: false
      volumeID:
        type: string
        description: >-
          volumeID is unique ID of the persistent disk resource in AWS (Amazon EBS volume).
          More info: https://kubernetes.io/docs/concepts/storage/volumes#awselasticblockstore
        required: true
  Affinity:
    description: Affinity is a group of affinity scheduling rules.
    properties:
      nodeAffinity:
        type: NodeAffinity
        description: Describes node affinity scheduling rules for the pod.
        required: false
      podAffinity:
        type: PodAffinity
        description: >-
          Describes pod affinity scheduling rules (e.g. co-locate this pod in the same node,
          zone, etc. as some other pod(s)).
        required: false
      podAntiAffinity:
        type: PodAntiAffinity
        description: >-
          Describes pod anti-affinity scheduling rules (e.g. avoid putting this pod in the
          same node, zone, etc. as some other pod(s)).
        required: false
  AppArmorProfile:
    description: >-
      AppArmorProfile defines a pod or container's AppArmor settings.
    properties:
      localhostProfile:
        type: string
        description: >-
          localhostProfile indicates a profile loaded on the node that should be used. The
          profile must be preconfigured on the node to work. Must match the loaded name of
          the profile. Must be set if and only if type is "Localhost".
        required: false
      type:
        type: string
        description: >-
          type indicates which kind of AppArmor profile will be applied. Valid options are:
            Localhost - a profile pre-loaded on the node.
            RuntimeDefault - the container runtime's default profile.
            Unconfined - no AppArmor enforcement.
        required: true
  AttachedVolume:
    description: AttachedVolume describes a volume attached to a node
    properties:
      devicePath:
        type: string
        description: >-
          DevicePath represents the device path where the volume should be available
        required: true
      name:
        type: string
        description: Name of the attached volume
        required: true
  AzureDiskVolumeSource:
    description: >-
      AzureDisk represents an Azure Data Disk mount on the host and bind mount to the pod.
    properties:
      cachingMode:
        type: string
        description: >-
          cachingMode is the Host Caching mode: None, Read Only, Read Write.
        required: false
      diskName:
        type: string
        description: diskName is the Name of the data disk in the blob storage
        required: true
      diskURI:
        type: string
        description: diskURI is the URI of data disk in the blob storage
        required: true
      fsType:
        type: string
        description: >-
          fsType is Filesystem type to mount. Must be a filesystem type supported by the host
          operating system. Ex. "ext4", "xfs", "ntfs". Implicitly inferred to be "ext4" if
          unspecified.
        required: false
      kind:
        type: string
        description: >-
          kind expected values are Shared: multiple blob disks per storage account  Dedicated:
          single blob disk per storage account  Managed: azure managed data disk (only in
          managed availability set). defaults to shared
        required: false
      readOnly:
        type: boolean
        description: >-
          readOnly Defaults to false (read/write). ReadOnly here will force the ReadOnly setting
          in VolumeMounts.
        required: false
  AzureFilePersistentVolumeSource:
    description: >-
      AzureFile represents an Azure File Service mount on the host and bind mount to the pod.
    properties:
      readOnly:
        type: boolean
        description: >-
          readOnly defaults to false (read/write). ReadOnly here will force the ReadOnly setting
          in VolumeMounts.
        required: false
      secretName:
        type: string
        description: >-
          secretName is the name of secret that contains Azure Storage Account Name and Key
        required: true
      secretNamespace:
        type: string
        description: >-
          secretNamespace is the namespace of the secret that contains Azure Storage Account
          Name and Key default is the same as the Pod
        required: false
      shareName:
        type: string
        description: shareName is the azure Share Name
        required: true
  AzureFileVolumeSource:
    description: >-
      AzureFile represents an Azure File Service mount on the host and bind mount to the pod.
    properties:
      readOnly:
        type: boolean
        description: >-
          readOnly defaults to false (read/write). ReadOnly here will force the ReadOnly setting
          in VolumeMounts.
        required: false
      secretName:
        type: string
        description: >-
          secretName is the  name of secret that contains Azure Storage Account Name and Key
        required: true
      shareName:
        type: string
        description: shareName is the azure share Name
        required: true
  Binding:
    description: >-
      Binding ties one object to another; for example, a pod is bound to a node by a scheduler.
    metadata:
      x-kubernetes-group-version-kind:
        group: ''
        kind: Binding
        version: v1
    properties:
      apiVersion:
        type: string
        description: >-
          APIVersion defines the versioned schema of this representation of an object. Servers
          should convert recognized schemas to the latest internal value, and may reject unrecognized
          values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
        required: false
      kind:
        type: string
        description: >-
          Kind is a string value representing the REST resource this object represents. Servers
          may infer this from the endpoint the client submits requests to. Cannot be updated.
          In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
        required: false
      metadata:
        type: meta:ObjectMeta
        description: >-
          Standard object's metadata. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata
        required: false
      target:
        type: ObjectReference
        description: >-
          The target object that you want to bind to the standard object.
        required: true
  CSIPersistentVolumeSource:
    description: >-
      Represents storage that is managed by an external CSI volume driver
    properties:
      controllerExpandSecretRef:
        type: SecretReference
        description: >-
          controllerExpandSecretRef is a reference to the secret object containing sensitive
          information to pass to the CSI driver to complete the CSI ControllerExpandVolume
          call. This field is optional, and may be empty if no secret is required. If the
          secret object contains more than one secret, all secrets are passed.
        required: false
      controllerPublishSecretRef:
        type: SecretReference
        description: >-
          controllerPublishSecretRef is a reference to the secret object containing sensitive
          information to pass to the CSI driver to complete the CSI ControllerPublishVolume
          and ControllerUnpublishVolume calls. This field is optional, and may be empty if
          no secret is required. If the secret object contains more than one secret, all secrets
          are passed.
        required: false
      driver:
        type: string
        description: >-
          driver is the name of the driver to use for this volume. Required.
        required: true
      fsType:
        type: string
        description: >-
          fsType to mount. Must be a filesystem type supported by the host operating system.
          Ex. "ext4", "xfs", "ntfs".
        required: false
      nodeExpandSecretRef:
        type: SecretReference
        description: >-
          nodeExpandSecretRef is a reference to the secret object containing sensitive information
          to pass to the CSI driver to complete the CSI NodeExpandVolume call. This field
          is optional, may be omitted if no secret is required. If the secret object contains
          more than one secret, all secrets are passed.
        required: false
      nodePublishSecretRef:
        type: SecretReference
        description: >-
          nodePublishSecretRef is a reference to the secret object containing sensitive information
          to pass to the CSI driver to complete the CSI NodePublishVolume and NodeUnpublishVolume
          calls. This field is optional, and may be empty if no secret is required. If the
          secret object contains more than one secret, all secrets are passed.
        required: false
      nodeStageSecretRef:
        type: SecretReference
        description: >-
          nodeStageSecretRef is a reference to the secret object containing sensitive information
          to pass to the CSI driver to complete the CSI NodeStageVolume and NodeStageVolume
          and NodeUnstageVolume calls. This field is optional, and may be empty if no secret
          is required. If the secret object contains more than one secret, all secrets are
          passed.
        required: false
      readOnly:
        type: boolean
        description: >-
          readOnly value to pass to ControllerPublishVolumeRequest. Defaults to false (read/write).
        required: false
      volumeAttributes:
        type: map
        description: volumeAttributes of the volume to publish.
        required: false
        entry_schema:
          type: string
      volumeHandle:
        type: string
        description: >-
          volumeHandle is the unique volume name returned by the CSI volume plugin’s CreateVolume
          to refer to the volume on all subsequent calls. Required.
        required: true
  CSIVolumeSource:
    description: >-
      Represents a source location of a volume to mount, managed by an external CSI driver
    properties:
      driver:
        type: string
        description: >-
          driver is the name of the CSI driver that handles this volume. Consult with your
          admin for the correct name as registered in the cluster.
        required: true
      fsType:
        type: string
        description: >-
          fsType to mount. Ex. "ext4", "xfs", "ntfs". If not provided, the empty value is
          passed to the associated CSI driver which will determine the default filesystem
          to apply.
        required: false
      nodePublishSecretRef:
        type: LocalObjectReference
        description: >-
          nodePublishSecretRef is a reference to the secret object containing sensitive information
          to pass to the CSI driver to complete the CSI NodePublishVolume and NodeUnpublishVolume
          calls. This field is optional, and  may be empty if no secret is required. If the
          secret object contains more than one secret, all secret references are passed.
        required: false
      readOnly:
        type: boolean
        description: >-
          readOnly specifies a read-only configuration for the volume. Defaults to false (read/write).
        required: false
      volumeAttributes:
        type: map
        description: >-
          volumeAttributes stores driver-specific properties that are passed to the CSI driver.
          Consult your driver's documentation for supported values.
        required: false
        entry_schema:
          type: string
  Capabilities:
    description: Adds and removes POSIX capabilities from running containers.
    properties:
      add:
        type: list
        description: Added capabilities
        required: false
        entry_schema:
          type: string
        metadata:
          x-kubernetes-list-type: atomic
      drop:
        type: list
        description: Removed capabilities
        required: false
        entry_schema:
          type: string
        metadata:
          x-kubernetes-list-type: atomic
  CephFSPersistentVolumeSource:
    description: >-
      Represents a Ceph Filesystem mount that lasts the lifetime of a pod Cephfs volumes do
      not support ownership management or SELinux relabeling.
    properties:
      monitors:
        type: list
        description: >-
          monitors is Required: Monitors is a collection of Ceph monitors More info: https://examples.k8s.io/volumes/cephfs/README.md#how-to-use-it
        required: true
        entry_schema:
          type: string
        metadata:
          x-kubernetes-list-type: atomic
      path:
        type: string
        description: >-
          path is Optional: Used as the mounted root, rather than the full Ceph tree, default
          is /
        required: false
      readOnly:
        type: boolean
        description: >-
          readOnly is Optional: Defaults to false (read/write). ReadOnly here will force the
          ReadOnly setting in VolumeMounts. More info: https://examples.k8s.io/volumes/cephfs/README.md#how-to-use-it
        required: false
      secretFile:
        type: string
        description: >-
          secretFile is Optional: SecretFile is the path to key ring for User, default is
          /etc/ceph/user.secret More info: https://examples.k8s.io/volumes/cephfs/README.md#how-to-use-it
        required: false
      secretRef:
        type: SecretReference
        description: >-
          secretRef is Optional: SecretRef is reference to the authentication secret for User,
          default is empty. More info: https://examples.k8s.io/volumes/cephfs/README.md#how-to-use-it
        required: false
      user:
        type: string
        description: >-
          user is Optional: User is the rados user name, default is admin More info: https://examples.k8s.io/volumes/cephfs/README.md#how-to-use-it
        required: false
  CephFSVolumeSource:
    description: >-
      Represents a Ceph Filesystem mount that lasts the lifetime of a pod Cephfs volumes do
      not support ownership management or SELinux relabeling.
    properties:
      monitors:
        type: list
        description: >-
          monitors is Required: Monitors is a collection of Ceph monitors More info: https://examples.k8s.io/volumes/cephfs/README.md#how-to-use-it
        required: true
        entry_schema:
          type: string
        metadata:
          x-kubernetes-list-type: atomic
      path:
        type: string
        description: >-
          path is Optional: Used as the mounted root, rather than the full Ceph tree, default
          is /
        required: false
      readOnly:
        type: boolean
        description: >-
          readOnly is Optional: Defaults to false (read/write). ReadOnly here will force the
          ReadOnly setting in VolumeMounts. More info: https://examples.k8s.io/volumes/cephfs/README.md#how-to-use-it
        required: false
      secretFile:
        type: string
        description: >-
          secretFile is Optional: SecretFile is the path to key ring for User, default is
          /etc/ceph/user.secret More info: https://examples.k8s.io/volumes/cephfs/README.md#how-to-use-it
        required: false
      secretRef:
        type: LocalObjectReference
        description: >-
          secretRef is Optional: SecretRef is reference to the authentication secret for User,
          default is empty. More info: https://examples.k8s.io/volumes/cephfs/README.md#how-to-use-it
        required: false
      user:
        type: string
        description: >-
          user is optional: User is the rados user name, default is admin More info: https://examples.k8s.io/volumes/cephfs/README.md#how-to-use-it
        required: false
  CinderPersistentVolumeSource:
    description: >-
      Represents a cinder volume resource in Openstack. A Cinder volume must exist before
      mounting to a container. The volume must also be in the same region as the kubelet.
      Cinder volumes support ownership management and SELinux relabeling.
    properties:
      fsType:
        type: string
        description: >-
          fsType Filesystem type to mount. Must be a filesystem type supported by the host
          operating system. Examples: "ext4", "xfs", "ntfs". Implicitly inferred to be "ext4"
          if unspecified. More info: https://examples.k8s.io/mysql-cinder-pd/README.md
        required: false
      readOnly:
        type: boolean
        description: >-
          readOnly is Optional: Defaults to false (read/write). ReadOnly here will force the
          ReadOnly setting in VolumeMounts. More info: https://examples.k8s.io/mysql-cinder-pd/README.md
        required: false
      secretRef:
        type: SecretReference
        description: >-
          secretRef is Optional: points to a secret object containing parameters used to connect
          to OpenStack.
        required: false
      volumeID:
        type: string
        description: >-
          volumeID used to identify the volume in cinder. More info: https://examples.k8s.io/mysql-cinder-pd/README.md
        required: true
  CinderVolumeSource:
    description: >-
      Represents a cinder volume resource in Openstack. A Cinder volume must exist before
      mounting to a container. The volume must also be in the same region as the kubelet.
      Cinder volumes support ownership management and SELinux relabeling.
    properties:
      fsType:
        type: string
        description: >-
          fsType is the filesystem type to mount. Must be a filesystem type supported by the
          host operating system. Examples: "ext4", "xfs", "ntfs". Implicitly inferred to be
          "ext4" if unspecified. More info: https://examples.k8s.io/mysql-cinder-pd/README.md
        required: false
      readOnly:
        type: boolean
        description: >-
          readOnly defaults to false (read/write). ReadOnly here will force the ReadOnly setting
          in VolumeMounts. More info: https://examples.k8s.io/mysql-cinder-pd/README.md
        required: false
      secretRef:
        type: LocalObjectReference
        description: >-
          secretRef is optional: points to a secret object containing parameters used to connect
          to OpenStack.
        required: false
      volumeID:
        type: string
        description: >-
          volumeID used to identify the volume in cinder. More info: https://examples.k8s.io/mysql-cinder-pd/README.md
        required: true
  ClientIPConfig:
    description: >-
      ClientIPConfig represents the configurations of Client IP based session affinity.
    properties:
      timeoutSeconds:
        type: integer
        description: >-
          timeoutSeconds specifies the seconds of ClientIP type session sticky time. The value
          must be >0 && <=86400(for 1 day) if ServiceAffinity == "ClientIP". Default value
          is 10800(for 3 hours).
        required: false
  ClusterTrustBundleProjection:
    description: >-
      ClusterTrustBundleProjection describes how to select a set of ClusterTrustBundle objects
      and project their contents into the pod filesystem.
    properties:
      labelSelector:
        type: meta:LabelSelector
        description: >-
          Select all ClusterTrustBundles that match this label selector.  Only has effect
          if signerName is set.  Mutually-exclusive with name.  If unset, interpreted as "match
          nothing".  If set but empty, interpreted as "match everything".
        required: false
      name:
        type: string
        description: >-
          Select a single ClusterTrustBundle by object name.  Mutually-exclusive with signerName
          and labelSelector.
        required: false
      optional:
        type: boolean
        description: >-
          If true, don't block pod startup if the referenced ClusterTrustBundle(s) aren't
          available.  If using name, then the named ClusterTrustBundle is allowed not to exist.  If
          using signerName, then the combination of signerName and labelSelector is allowed
          to match zero ClusterTrustBundles.
        required: false
      path:
        type: string
        description: Relative path from the volume root to write the bundle.
        required: true
      signerName:
        type: string
        description: >-
          Select all ClusterTrustBundles that match this signer name. Mutually-exclusive with
          name.  The contents of all selected ClusterTrustBundles will be unified and deduplicated.
        required: false
      user:
        type: integer
        description: >-
          user is Optional: The owner UID of the created file. If specified, the item-level
          user field takes precedence over defaultUser. (Alpha) This field requires the AtomicWriteVolumeUserFields
          feature gate to be enabled.
        required: false
  ComponentCondition:
    description: Information about the condition of a component.
    properties:
      error:
        type: string
        description: >-
          Condition error code for a component. For example, a health check error code.
        required: false
      message:
        type: string
        description: >-
          Message about the condition for a component. For example, information about a health
          check.
        required: false
      status:
        type: string
        description: >-
          Status of the condition for a component. Valid values for "Healthy": "True", "False",
          or "Unknown".
        required: true
      type:
        type: string
        description: 'Type of condition for a component. Valid value: "Healthy"'
        required: true
  ComponentStatus:
    description: >-
      ComponentStatus (and ComponentStatusList) holds the cluster validation info. Deprecated:
      This API is deprecated in v1.19+
    metadata:
      x-kubernetes-group-version-kind:
        group: ''
        kind: ComponentStatus
        version: v1
    properties:
      apiVersion:
        type: string
        description: >-
          APIVersion defines the versioned schema of this representation of an object. Servers
          should convert recognized schemas to the latest internal value, and may reject unrecognized
          values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
        required: false
      conditions:
        type: list
        description: List of component conditions observed
        required: false
        entry_schema:
          type: ComponentCondition
        metadata:
          x-kubernetes-list-type: map
          x-kubernetes-list-map-keys: [type]
      kind:
        type: string
        description: >-
          Kind is a string value representing the REST resource this object represents. Servers
          may infer this from the endpoint the client submits requests to. Cannot be updated.
          In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
        required: false
      metadata:
        type: meta:ObjectMeta
        description: >-
          Standard object's metadata. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata
        required: false
  ConfigMapEnvSource:
    description: >-
      ConfigMapEnvSource selects a ConfigMap to populate the environment variables with.


      The contents of the target ConfigMap's Data field will represent the key-value pairs
      as environment variables. Keys in the BinaryData field are not currently propagated
      to container env vars.
    properties:
      name:
        type: string
        description: >-
          Name of the referent. This field is effectively required, but due to backwards compatibility
          is allowed to be empty. Instances of this type with an empty value here are almost
          certainly wrong. More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
        required: false
      optional:
        type: boolean
        description: Specify whether the ConfigMap must be defined
        required: false
  ConfigMapKeySelector:
    description: Selects a key from a ConfigMap.
    metadata:
      x-kubernetes-map-type: atomic
    properties:
      key:
        type: string
        description: >-
          The key to select from the ConfigMap's Data field. Keys in the BinaryData field
          are not currently propagated to container env vars.
        required: true
      name:
        type: string
        description: >-
          Name of the referent. This field is effectively required, but due to backwards compatibility
          is allowed to be empty. Instances of this type with an empty value here are almost
          certainly wrong. More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
        required: false
      optional:
        type: boolean
        description: Specify whether the ConfigMap or its key must be defined
        required: false
  ConfigMapNodeConfigSource:
    description: >-
      ConfigMapNodeConfigSource contains the information to reference a ConfigMap as a config
      source for the Node. This API is deprecated since 1.22: https://git.k8s.io/enhancements/keps/sig-node/281-dynamic-kubelet-configuration
    properties:
      kubeletConfigKey:
        type: string
        description: >-
          KubeletConfigKey declares which key of the referenced ConfigMap corresponds to the
          KubeletConfiguration structure This field is required in all cases.
        required: true
      name:
        type: string
        description: >-
          Name is the metadata.name of the referenced ConfigMap. This field is required in
          all cases.
        required: true
      namespace:
        type: string
        description: >-
          Namespace is the metadata.namespace of the referenced ConfigMap. This field is required
          in all cases.
        required: true
      resourceVersion:
        type: string
        description: >-
          ResourceVersion is the metadata.ResourceVersion of the referenced ConfigMap. This
          field is forbidden in Node.Spec, and required in Node.Status.
        required: false
      uid:
        type: string
        description: >-
          UID is the metadata.UID of the referenced ConfigMap. This field is forbidden in
          Node.Spec, and required in Node.Status.
        required: false
  ConfigMapProjection:
    description: >-
      Adapts a ConfigMap into a projected volume.


      The contents of the target ConfigMap's Data field will be presented in a projected volume
      as files using the keys in the Data field as the file names, unless the items element
      is populated with specific mappings of keys to paths. Note that this is identical to
      a configmap volume source without the default mode.
    properties:
      items:
        type: list
        description: >-
          items if unspecified, each key-value pair in the Data field of the referenced ConfigMap
          will be projected into the volume as a file whose name is the key and content is
          the value. If specified, the listed keys will be projected into the specified paths,
          and unlisted keys will not be present. If a key is specified which is not present
          in the ConfigMap, the volume setup will error unless it is marked optional. Paths
          must be relative and may not contain the '..' path or start with '..'.
        required: false
        entry_schema:
          type: KeyToPath
        metadata:
          x-kubernetes-list-type: atomic
      name:
        type: string
        description: >-
          Name of the referent. This field is effectively required, but due to backwards compatibility
          is allowed to be empty. Instances of this type with an empty value here are almost
          certainly wrong. More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
        required: false
      optional:
        type: boolean
        description: >-
          optional specify whether the ConfigMap or its keys must be defined
        required: false
  ConfigMapVolumeSource:
    description: >-
      Adapts a ConfigMap into a volume.


      The contents of the target ConfigMap's Data field will be presented in a volume as files
      using the keys in the Data field as the file names, unless the items element is populated
      with specific mappings of keys to paths. ConfigMap volumes support ownership management
      and SELinux relabeling.
    properties:
      defaultMode:
        type: integer
        description: >-
          defaultMode is optional: mode bits used to set permissions on created files by default.
          Must be an octal value between 0000 and 0777 or a decimal value between 0 and 511.
