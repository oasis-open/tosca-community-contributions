      image:
        type: ImageVolumeSource
        description: >-
          image represents an OCI object (a container image or artifact) pulled and mounted
          on the kubelet's host machine. The volume is resolved at pod startup depending on
          which PullPolicy value is provided:


          - Always: the kubelet always attempts to pull the reference. Container creation
          will fail If the pull fails. - Never: the kubelet never pulls the reference and
          only uses a local image or artifact. Container creation will fail if the reference
          isn't present. - IfNotPresent: the kubelet pulls if the reference isn't already
          present on disk. Container creation will fail if the reference isn't present and
          the pull fails.


          The volume gets re-resolved if the pod gets deleted and recreated, which means that
          new remote content will become available on pod recreation. A failure to resolve
          or pull the image during pod startup will block containers from starting and may
          add significant latency. Failures will be retried using normal volume backoff and
          will be reported on the pod reason and message. The types of objects that may be
          mounted by this volume are defined by the container runtime implementation on a
          host machine and at minimum must include all valid types supported by the container
          image field. The OCI object gets mounted in a single directory (spec.containers[*].volumeMounts.mountPath)
          by merging the manifest layers in the same way as for container images. The volume
          will be mounted read-only (ro). Sub path mounts for containers are not supported
          (spec.containers[*].volumeMounts.subpath) before 1.33. The field spec.securityContext.fsGroupChangePolicy
          has no effect on this volume type.
        required: false
      iscsi:
        type: ISCSIVolumeSource
        description: >-
