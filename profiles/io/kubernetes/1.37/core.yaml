  VolumeHealthCondition:
    description: >-
      VolumeHealthCondition represents an adverse health condition reported for a volume.
    properties:
      message:
        type: string
        description: >-
          message is a human-readable description. Maximum permitted length of a message is
          1024 bytes.
        required: false
      reason:
        type: string
        description: >-
          reason is a brief CamelCase machine-parseable reason. Together with status it forms
          the unique identity of a condition entry. Maximum permitted length of a reason is
          256 bytes.
        required: true
      status:
        type: string
        description: >-
          status is the machine-parseable health category. Possible values: - "Inaccessible":
          the volume cannot be accessed. - "DataLoss": data loss has been detected on the
          volume. - "Degraded": the volume is functioning with reduced capability.
        required: true
  VolumeHealthStatus:
    description: >-
      VolumeHealthStatus contains health information for a volume reported by the CSI controller
      plugin.
    properties:
      healthConditions:
        type: list
        description: >-
          conditions is the set of adverse conditions reported by the CSI controller plugin.
          An empty list means no adverse condition. At most 16 conditions may be reported.
