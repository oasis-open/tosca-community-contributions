tosca_definitions_version: tosca_2_0
description: Types generated from JSON Schema by any2tosca
imports:
- url: meta.yaml
  namespace: meta
node_types:
  PriorityClass:
    description: >-
      PriorityClass defines mapping from a priority class name to the priority integer value.
      The value can be any valid integer.
    metadata:
      x-kubernetes-group-version-kind:
        group: scheduling.k8s.io
        kind: PriorityClass
        version: v1
    properties:
      description:
        type: string
        description: >-
          description is an arbitrary string that usually provides guidelines on when this
          priority class should be used.
        required: false
      globalDefault:
        type: boolean
        description: >-
          globalDefault specifies whether this PriorityClass should be considered as the default
          priority for pods that do not have any priority class. Only one PriorityClass can
          be marked as `globalDefault`. However, if more than one PriorityClasses exists with
          their `globalDefault` field set to true, the smallest value of such global default
          PriorityClasses will be used as the default priority.
        required: false
      metadata:
        type: meta:ObjectMeta
        description: >-
          metadata is the standard object metadata. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata
        required: false
      preemptionPolicy:
        type: string
        description: >-
          preemptionPolicy is the Policy for preempting pods with lower priority. One of Never,
          PreemptLowerPriority. Defaults to PreemptLowerPriority if unset.
        required: false
      value:
        type: integer
        description: >-
          value represents the integer value of this priority class. This is the actual priority
          that pods receive when they have the name of this class in their pod spec.
        required: false
