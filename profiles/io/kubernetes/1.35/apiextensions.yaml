tosca_definitions_version: tosca_2_0
description: Types generated from JSON Schema by any2tosca
imports:
- url: meta.yaml
  namespace: meta
data_types:
  CustomResourceColumnDefinition:
    description: >-
      CustomResourceColumnDefinition specifies a column for server side printing.
    properties:
      description:
        type: string
        description: description is a human readable description of this column.
        required: false
      format:
        type: string
        description: >-
          format is an optional OpenAPI type definition for this column. The 'name' format
          is applied to the primary identifier column to assist in clients identifying column
          is the resource name. See https://github.com/OAI/OpenAPI-Specification/blob/master/versions/2.0.md#data-types
          for details.
        required: false
      jsonPath:
        type: string
        description: >-
          jsonPath is a simple JSON path (i.e. with array notation) which is evaluated against
          each custom resource to produce the value for this column.
        required: true
      name:
        type: string
        description: name is a human readable name for the column.
        required: true
      priority:
        type: integer
        description: >-
          priority is an integer defining the relative importance of this column compared
          to others. Lower numbers are considered higher priority. Columns that may be omitted
          in limited space scenarios should be given a priority greater than 0.
        required: false
      type:
        type: string
        description: >-
          type is an OpenAPI type definition for this column. See https://github.com/OAI/OpenAPI-Specification/blob/master/versions/2.0.md#data-types
          for details.
        required: true
  CustomResourceConversion:
    description: >-
      CustomResourceConversion describes how to convert different versions of a CR.
    properties:
      strategy:
        type: string
        description: >-
          strategy specifies how custom resources are converted between versions. Allowed
          values are: - `"None"`: The converter only change the apiVersion and would not touch
          any other field in the custom resource. - `"Webhook"`: API Server will call to an
          external webhook to do the conversion. Additional information
            is needed for this option. This requires spec.preserveUnknownFields to
          be false, and spec.conversion.webhook to be set.
        required: true
      webhook:
        type: WebhookConversion
        description: >-
          webhook describes how to call the conversion webhook. Required when `strategy` is
          set to `"Webhook"`.
        required: false
  CustomResourceDefinitionCondition:
    description: >-
      CustomResourceDefinitionCondition contains details for the current condition of this
      pod.
    properties:
      lastTransitionTime:
        type: meta:Time
        description: >-
          lastTransitionTime last time the condition transitioned from one status to another.
        required: false
      message:
        type: string
        description: >-
          message is a human-readable message indicating details about last transition.
        required: false
      observedGeneration:
        type: integer
        description: >-
          observedGeneration represents the .metadata.generation that the condition was set
          based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration
          is 9, the condition is out of date with respect to the current state of the instance.
        required: false
      reason:
        type: string
        description: >-
          reason is a unique, one-word, CamelCase reason for the condition's last transition.
        required: false
      status:
        type: string
        description: >-
          status is the status of the condition. Can be True, False, Unknown.
        required: true
      type:
        type: string
        description: >-
          type is the type of the condition. Types include Established, NamesAccepted and
          Terminating.
        required: true
  CustomResourceDefinitionNames:
    description: >-
      CustomResourceDefinitionNames indicates the names to serve this CustomResourceDefinition
    properties:
      categories:
        type: list
        description: >-
          categories is a list of grouped resources this custom resource belongs to (e.g.
          'all'). This is published in API discovery documents, and used by clients to support
          invocations like `kubectl get all`.
        required: false
        entry_schema:
          type: string
        metadata:
          x-kubernetes-list-type: atomic
      kind:
        type: string
        description: >-
          kind is the serialized kind of the resource. It is normally CamelCase and singular.
          Custom resource instances will use this value as the `kind` attribute in API calls.
        required: true
      listKind:
        type: string
        description: >-
          listKind is the serialized kind of the list for this resource. Defaults to "`kind`List".
        required: false
      plural:
        type: string
        description: >-
          plural is the plural name of the resource to serve. The custom resources are served
          under `/apis/<group>/<version>/.../<plural>`. Must match the name of the CustomResourceDefinition
          (in the form `<names.plural>.<group>`). Must be all lowercase.
        required: true
      shortNames:
        type: list
        description: >-
          shortNames are short names for the resource, exposed in API discovery documents,
          and used by clients to support invocations like `kubectl get <shortname>`. It must
          be all lowercase.
        required: false
        entry_schema:
          type: string
        metadata:
          x-kubernetes-list-type: atomic
      singular:
        type: string
        description: >-
          singular is the singular name of the resource. It must be all lowercase. Defaults
          to lowercased `kind`.
        required: false
  CustomResourceDefinitionSpec:
    description: >-
      CustomResourceDefinitionSpec describes how a user wants their resource to appear
    properties:
      conversion:
        type: CustomResourceConversion
        description: conversion defines conversion settings for the CRD.
        required: false
      group:
        type: string
        description: >-
          group is the API group of the defined custom resource. The custom resources are
          served under `/apis/<group>/...`. Must match the name of the CustomResourceDefinition
          (in the form `<names.plural>.<group>`).
        required: true
      names:
        type: CustomResourceDefinitionNames
        description: >-
          names specify the resource and kind names for the custom resource.
        required: true
      preserveUnknownFields:
        type: boolean
        description: >-
          preserveUnknownFields indicates that object fields which are not specified in the
          OpenAPI schema should be preserved when persisting to storage. apiVersion, kind,
          metadata and known fields inside metadata are always preserved. This field is deprecated
          in favor of setting `x-preserve-unknown-fields` to true in `spec.versions[*].schema.openAPIV3Schema`.
          See https://kubernetes.io/docs/tasks/extend-kubernetes/custom-resources/custom-resource-definitions/#field-pruning
          for details.
        required: false
      scope:
        type: string
        description: >-
          scope indicates whether the defined custom resource is cluster- or namespace-scoped.
          Allowed values are `Cluster` and `Namespaced`.
        required: true
      versions:
        type: list
        description: >-
          versions is the list of all API versions of the defined custom resource. Version
          names are used to compute the order in which served versions are listed in API discovery.
          If the version string is "kube-like", it will sort above non "kube-like" version
          strings, which are ordered lexicographically. "Kube-like" versions start with a
          "v", then are followed by a number (the major version), then optionally the string
          "alpha" or "beta" and another number (the minor version). These are sorted first
          by GA > beta > alpha (where GA is a version with no suffix such as beta or alpha),
          and then by comparing major version, then minor version. An example sorted list
          of versions: v10, v2, v1, v11beta2, v10beta3, v3beta1, v12alpha1, v11alpha2, foo1,
          foo10.
        required: true
        entry_schema:
          type: CustomResourceDefinitionVersion
        metadata:
          x-kubernetes-list-type: atomic
  CustomResourceDefinitionStatus:
    description: >-
      CustomResourceDefinitionStatus indicates the state of the CustomResourceDefinition
    properties:
      acceptedNames:
        type: CustomResourceDefinitionNames
        description: >-
          acceptedNames are the names that are actually being used to serve discovery. They
          may be different than the names in spec.
        required: false
      conditions:
        type: list
        description: >-
          conditions indicate state for particular aspects of a CustomResourceDefinition
        required: false
        entry_schema:
          type: CustomResourceDefinitionCondition
        metadata:
          x-kubernetes-list-type: map
          x-kubernetes-list-map-keys: [type]
      observedGeneration:
        type: integer
        description: The generation observed by the CRD controller.
        required: false
      storedVersions:
        type: list
        description: >-
          storedVersions lists all versions of CustomResources that were ever persisted. Tracking
          these versions allows a migration path for stored versions in etcd. The field is
          mutable so a migration controller can finish a migration to another version (ensuring
          no old objects are left in storage), and then remove the rest of the versions from
          this list. Versions may not be removed from `spec.versions` while they exist in
          this list.
        required: false
        entry_schema:
          type: string
        metadata:
          x-kubernetes-list-type: atomic
  CustomResourceDefinitionVersion:
    description: CustomResourceDefinitionVersion describes a version for CRD.
    properties:
      additionalPrinterColumns:
        type: list
        description: >-
          additionalPrinterColumns specifies additional columns returned in Table output.
          See https://kubernetes.io/docs/reference/using-api/api-concepts/#receiving-resources-as-tables
          for details. If no columns are specified, a single column displaying the age of
          the custom resource is used.
        required: false
        entry_schema:
          type: CustomResourceColumnDefinition
        metadata:
          x-kubernetes-list-type: atomic
      deprecated:
        type: boolean
        description: >-
          deprecated indicates this version of the custom resource API is deprecated. When
          set to true, API requests to this version receive a warning header in the server
          response. Defaults to false.
        required: false
      deprecationWarning:
        type: string
        description: >-
          deprecationWarning overrides the default warning returned to API clients. May only
          be set when `deprecated` is true. The default warning indicates this version is
          deprecated and recommends use of the newest served version of equal or greater stability,
          if one exists.
        required: false
      name:
        type: string
        description: >-
          name is the version name, e.g. “v1”, “v2beta1”, etc. The custom resources are served
          under this version at `/apis/<group>/<version>/...` if `served` is true.
        required: true
      schema:
        type: CustomResourceValidation
        description: >-
          schema describes the schema used for validation, pruning, and defaulting of this
          version of the custom resource.
        required: false
      selectableFields:
        type: list
        description: >-
          selectableFields specifies paths to fields that may be used as field selectors.
          A maximum of 8 selectable fields are allowed. See https://kubernetes.io/docs/concepts/overview/working-with-objects/field-selectors
        required: false
        entry_schema:
          type: SelectableField
        metadata:
          x-kubernetes-list-type: atomic
      served:
        type: boolean
        description: >-
          served is a flag enabling/disabling this version from being served via REST APIs
        required: true
      storage:
        type: boolean
        description: >-
          storage indicates this version should be used when persisting custom resources to
          storage. There must be exactly one version with storage=true.
        required: true
      subresources:
        type: CustomResourceSubresources
        description: >-
          subresources specify what subresources this version of the defined custom resource
          have.
        required: false
  CustomResourceSubresourceScale:
    description: >-
      CustomResourceSubresourceScale defines how to serve the scale subresource for CustomResources.
    properties:
      labelSelectorPath:
        type: string
        description: >-
          labelSelectorPath defines the JSON path inside of a custom resource that corresponds
          to Scale `status.selector`. Only JSON paths without the array notation are allowed.
          Must be a JSON Path under `.status` or `.spec`. Must be set to work with HorizontalPodAutoscaler.
          The field pointed by this JSON path must be a string field (not a complex selector
          struct) which contains a serialized label selector in string form. More info: https://kubernetes.io/docs/tasks/access-kubernetes-api/custom-resources/custom-resource-definitions#scale-subresource
          If there is no value under the given path in the custom resource, the `status.selector`
          value in the `/scale` subresource will default to the empty string.
        required: false
      specReplicasPath:
        type: string
        description: >-
          specReplicasPath defines the JSON path inside of a custom resource that corresponds
          to Scale `spec.replicas`. Only JSON paths without the array notation are allowed.
          Must be a JSON Path under `.spec`. If there is no value under the given path in
          the custom resource, the `/scale` subresource will return an error on GET.
        required: true
      statusReplicasPath:
        type: string
        description: >-
          statusReplicasPath defines the JSON path inside of a custom resource that corresponds
          to Scale `status.replicas`. Only JSON paths without the array notation are allowed.
          Must be a JSON Path under `.status`. If there is no value under the given path in
          the custom resource, the `status.replicas` value in the `/scale` subresource will
          default to 0.
        required: true
  CustomResourceSubresourceStatus:
    description: >-
      CustomResourceSubresourceStatus defines how to serve the status subresource for CustomResources.
      Status is represented by the `.status` JSON path inside of a CustomResource. When set,
      * exposes a /status subresource for the custom resource * PUT requests to the /status
      subresource take a custom resource object, and ignore changes to anything except the
      status stanza * PUT/POST/PATCH requests to the custom resource ignore changes to the
      status stanza
  CustomResourceSubresources:
    description: >-
      CustomResourceSubresources defines the status and scale subresources for CustomResources.
    properties:
      scale:
        type: CustomResourceSubresourceScale
        description: >-
          scale indicates the custom resource should serve a `/scale` subresource that returns
          an `autoscaling/v1` Scale object.
        required: false
      status:
        type: CustomResourceSubresourceStatus
        description: >-
          status indicates the custom resource should serve a `/status` subresource. When
          enabled: 1. requests to the custom resource primary endpoint ignore changes to the
          `status` stanza of the object. 2. requests to the custom resource `/status` subresource
          ignore changes to anything other than the `status` stanza of the object.
        required: false
  CustomResourceValidation:
    description: >-
      CustomResourceValidation is a list of validation methods for CustomResources.
    properties:
      openAPIV3Schema:
        type: JSONSchemaProps
        description: >-
          openAPIV3Schema is the OpenAPI v3 schema to use for validation and pruning.
        required: false
  ExternalDocumentation:
    description: >-
      ExternalDocumentation allows referencing an external resource for extended documentation.
    properties:
      description:
        type: string
        required: false
      url:
        type: string
        required: false
  JSON:
    description: >-
      JSON represents any valid JSON value. These types are supported: bool, int64, float64,
      string, []interface{}, map[string]interface{} and nil.
    derived_from: string
  JSONSchemaProps:
    description: >-
      JSONSchemaProps is a JSON-Schema following Specification Draft 4 (http://json-schema.org/).
    properties:
      $ref:
        type: string
        required: false
      $schema:
        type: string
        required: false
      additionalItems:
        type: JSONSchemaPropsOrBool
        description: >-
          JSONSchemaPropsOrBool represents JSONSchemaProps or a boolean value. Defaults to
          true for the boolean property.
        required: false
      additionalProperties:
        type: JSONSchemaPropsOrBool
        description: >-
          JSONSchemaPropsOrBool represents JSONSchemaProps or a boolean value. Defaults to
          true for the boolean property.
        required: false
      allOf:
        type: list
        required: false
        entry_schema:
          type: JSONSchemaProps
        metadata:
          x-kubernetes-list-type: atomic
      anyOf:
        type: list
        required: false
        entry_schema:
          type: JSONSchemaProps
        metadata:
          x-kubernetes-list-type: atomic
      default:
        type: JSON
        description: >-
          default is a default value for undefined object fields. Defaulting is a beta feature
          under the CustomResourceDefaulting feature gate. Defaulting requires spec.preserveUnknownFields
          to be false.
        required: false
      definitions:
        type: map
        required: false
        entry_schema:
          type: JSONSchemaProps
      dependencies:
        type: map
        required: false
        entry_schema:
          type: JSONSchemaPropsOrStringArray
      description:
        type: string
        required: false
      enum:
        type: list
        required: false
        entry_schema:
          type: JSON
        metadata:
          x-kubernetes-list-type: atomic
      example:
        type: JSON
        description: >-
          JSON represents any valid JSON value. These types are supported: bool, int64, float64,
          string, []interface{}, map[string]interface{} and nil.
        required: false
      exclusiveMaximum:
        type: boolean
        required: false
      exclusiveMinimum:
        type: boolean
        required: false
      externalDocs:
        type: ExternalDocumentation
        description: >-
          ExternalDocumentation allows referencing an external resource for extended documentation.
        required: false
      format:
        type: string
        description: >-
          format is an OpenAPI v3 format string. Unknown formats are ignored. The following
          formats are validated:


          - bsonobjectid: a bson object ID, i.e. a 24 characters hex string - uri: an URI
          as parsed by Golang net/url.ParseRequestURI - email: an email address as parsed
          by Golang net/mail.ParseAddress - hostname: a valid representation for an Internet
          host name, as defined by RFC 1034, section 3.1 [RFC1034]. - ipv4: an IPv4 IP as
          parsed by Golang net.ParseIP - ipv6: an IPv6 IP as parsed by Golang net.ParseIP
          - cidr: a CIDR as parsed by Golang net.ParseCIDR - mac: a MAC address as parsed
          by Golang net.ParseMAC - uuid: an UUID that allows uppercase defined by the regex
          (?i)^[0-9a-f]{8}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{12}$ - uuid3:
          an UUID3 that allows uppercase defined by the regex (?i)^[0-9a-f]{8}-?[0-9a-f]{4}-?3[0-9a-f]{3}-?[0-9a-f]{4}-?[0-9a-f]{12}$
          - uuid4: an UUID4 that allows uppercase defined by the regex (?i)^[0-9a-f]{8}-?[0-9a-f]{4}-?4[0-9a-f]{3}-?[89ab][0-9a-f]{3}-?[0-9a-f]{12}$
          - uuid5: an UUID5 that allows uppercase defined by the regex (?i)^[0-9a-f]{8}-?[0-9a-f]{4}-?5[0-9a-f]{3}-?[89ab][0-9a-f]{3}-?[0-9a-f]{12}$
          - isbn: an ISBN10 or ISBN13 number string like "0321751043" or "978-0321751041"
          - isbn10: an ISBN10 number string like "0321751043" - isbn13: an ISBN13 number string
          like "978-0321751041" - creditcard: a credit card number defined by the regex ^(?:4[0-9]{12}(?:[0-9]{3})?|5[1-5][0-9]{14}|6(?:011|5[0-9][0-9])[0-9]{12}|3[47][0-9]{13}|3(?:0[0-5]|[68][0-9])[0-9]{11}|(?:2131|1800|35\\d{3})\\d{11})$
          with any non digit characters mixed in - ssn: a U.S. social security number following
          the regex ^\\d{3}[- ]?\\d{2}[- ]?\\d{4}$ - hexcolor: an hexadecimal color code like
          "#FFFFFF: following the regex ^#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$ - rgbcolor: an
          RGB color code like rgb like "rgb(255,255,2559" - byte: base64 encoded binary data
          - password: any kind of string - date: a date string like "2006-01-02" as defined
          by full-date in RFC3339 - duration: a duration string like "22 ns" as parsed by
          Golang time.ParseDuration or compatible with Scala duration format - datetime: a
          date time string like "2014-12-15T19:30:20.000Z" as defined by date-time in RFC3339.
        required: false
      id:
        type: string
        required: false
      items:
        type: JSONSchemaPropsOrArray
        description: >-
          JSONSchemaPropsOrArray represents a value that can either be a JSONSchemaProps or
