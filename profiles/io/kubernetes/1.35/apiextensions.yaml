      namespace:
        type: string
        description: namespace is the namespace of the service. Required
        required: true
      path:
        type: string
        description: >-
          path is an optional URL path at which the webhook will be contacted.
        required: false
      port:
        type: integer
        description: >-
          port is an optional service port at which the webhook will be contacted. `port`
          should be a valid port number (1-65535, inclusive). Defaults to 443 for backward
          compatibility.
        required: false
  ValidationRule:
    description: >-
      ValidationRule describes a validation rule written in the CEL expression language.
    properties:
      fieldPath:
        type: string
        description: >-
          fieldPath represents the field path returned when the validation fails. It must
          be a relative JSON path (i.e. with array notation) scoped to the location of this
          x-kubernetes-validations extension in the schema and refer to an existing field.
          e.g. when validation checks if a specific attribute `foo` under a map `testMap`,
          the fieldPath could be set to `.testMap.foo` If the validation checks two lists
          must have unique attributes, the fieldPath could be set to either of the list: e.g.
          `.testList` It does not support list numeric index. It supports child operation
          to refer to an existing field currently. Refer to [JSONPath support in Kubernetes](https://kubernetes.io/docs/reference/kubectl/jsonpath/)
          for more info. Numeric index of array is not supported. For field name which contains
          special characters, use `['specialName']` to refer the field name. e.g. for attribute
          `foo.34$` appears in a list `testList`, the fieldPath could be set to `.testList['foo.34$']`
        required: false
      message:
        type: string
        description: >-
          Message represents the message displayed when validation fails. The message is required
          if the Rule contains line breaks. The message must not contain line breaks. If unset,
          the message is "failed rule: {Rule}". e.g. "must be a URL with the host matching
          spec.host"
        required: false
      messageExpression:
        type: string
        description: >-
          MessageExpression declares a CEL expression that evaluates to the validation failure
          message that is returned when this rule fails. Since messageExpression is used as
          a failure message, it must evaluate to a string. If both message and messageExpression
          are present on a rule, then messageExpression will be used if validation fails.
          If messageExpression results in a runtime error, the runtime error is logged, and
          the validation failure message is produced as if the messageExpression field were
          unset. If messageExpression evaluates to an empty string, a string with only spaces,
          or a string that contains line breaks, then the validation failure message will
          also be produced as if the messageExpression field were unset, and the fact that
          messageExpression produced an empty string/string with only spaces/string with line
          breaks will be logged. messageExpression has access to all the same variables as
          the rule; the only difference is the return type. Example: "x must be less than
          max ("+string(self.max)+")"
        required: false
      optionalOldSelf:
        type: boolean
        description: >-
          optionalOldSelf is used to opt a transition rule into evaluation even when the object
          is first created, or if the old object is missing the value.


          When enabled `oldSelf` will be a CEL optional whose value will be `None` if there
          is no old value, or when the object is initially created.


          You may check for presence of oldSelf using `oldSelf.hasValue()` and unwrap it after
          checking using `oldSelf.value()`. Check the CEL documentation for Optional types
          for more information: https://pkg.go.dev/github.com/google/cel-go/cel#OptionalTypes


          May not be set unless `oldSelf` is used in `rule`.
        required: false
      reason:
        type: string
        description: >-
          reason provides a machine-readable validation failure reason that is returned to
          the caller when a request fails this validation rule. The HTTP status code returned
          to the caller will match the reason of the reason of the first failed validation
          rule. The currently supported reasons are: "FieldValueInvalid", "FieldValueForbidden",
          "FieldValueRequired", "FieldValueDuplicate". If not set, default to use "FieldValueInvalid".
          All future added reasons must be accepted by clients when reading this value and
          unknown reasons should be treated as FieldValueInvalid.
        required: false
      rule:
        type: string
        description: "Rule represents the expression which will be evaluated by CEL. ref:\
          \ https://github.com/google/cel-spec The Rule is scoped to the location of the x-kubernetes-validations\
          \ extension in the schema. The `self` variable in the CEL expression is bound to\
          \ the scoped value. Example: - Rule scoped to the root of a resource with a status\
          \ subresource: {\"rule\": \"self.status.actual <= self.spec.maxDesired\"}\n\nIf\
          \ the Rule is scoped to an object with properties, the accessible properties of\
          \ the object are field selectable via `self.field` and field presence can be checked\
          \ via `has(self.field)`. Null valued fields are treated as absent fields in CEL\
          \ expressions. If the Rule is scoped to an object with additionalProperties (i.e.\
          \ a map) the value of the map are accessible via `self[mapKey]`, map containment\
          \ can be checked via `mapKey in self` and all entries of the map are accessible\
          \ via CEL macros and functions such as `self.all(...)`. If the Rule is scoped to\
          \ an array, the elements of the array are accessible via `self[i]` and also by macros\
          \ and functions. If the Rule is scoped to a scalar, `self` is bound to the scalar\
          \ value. Examples: - Rule scoped to a map of objects: {\"rule\": \"self.components['Widget'].priority\
          \ < 10\"} - Rule scoped to a list of integers: {\"rule\": \"self.values.all(value,\
          \ value >= 0 && value < 100)\"} - Rule scoped to a string value: {\"rule\": \"self.startsWith('kube')\"\
          }\n\nThe `apiVersion`, `kind`, `metadata.name` and `metadata.generateName` are always\
          \ accessible from the root of the object and from any x-kubernetes-embedded-resource\
          \ annotated objects. No other metadata properties are accessible.\n\nUnknown data\
          \ preserved in custom resources via x-kubernetes-preserve-unknown-fields is not\
          \ accessible in CEL expressions. This includes: - Unknown field values that are\
          \ preserved by object schemas with x-kubernetes-preserve-unknown-fields. - Object\
          \ properties where the property schema is of an \"unknown type\". An \"unknown type\"\
          \ is recursively defined as:\n  - A schema with no type and x-kubernetes-preserve-unknown-fields\
          \ set to true\n  - An array where the items schema is of an \"unknown type\"\n \
          \ - An object where the additionalProperties schema is of an \"unknown type\"\n\n\
          Only property names of the form `[a-zA-Z_.-/][a-zA-Z0-9_.-/]*` are accessible. Accessible\
          \ property names are escaped according to the following rules when accessed in the\
          \ expression: - '__' escapes to '__underscores__' - '.' escapes to '__dot__' - '-'\
          \ escapes to '__dash__' - '/' escapes to '__slash__' - Property names that exactly\
          \ match a CEL RESERVED keyword escape to '__{keyword}__'. The keywords are:\n\t\
          \  \"true\", \"false\", \"null\", \"in\", \"as\", \"break\", \"const\", \"continue\"\
          , \"else\", \"for\", \"function\", \"if\",\n\t  \"import\", \"let\", \"loop\", \"\
          package\", \"namespace\", \"return\".\nExamples:\n  - Rule accessing a property\
          \ named \"namespace\": {\"rule\": \"self.__namespace__ > 0\"}\n  - Rule accessing\
          \ a property named \"x-prop\": {\"rule\": \"self.x__dash__prop > 0\"}\n  - Rule\
          \ accessing a property named \"redact__d\": {\"rule\": \"self.redact__underscores__d\
          \ > 0\"}\n\nEquality on arrays with x-kubernetes-list-type of 'set' or 'map' ignores\
          \ element order, i.e. [1, 2] == [2, 1]. Concatenation on arrays with x-kubernetes-list-type\
          \ use the semantics of the list type:\n  - 'set': `X + Y` performs a union where\
          \ the array positions of all elements in `X` are preserved and\n    non-intersecting\
          \ elements in `Y` are appended, retaining their partial order.\n  - 'map': `X +\
          \ Y` performs a merge where the array positions of all keys in `X` are preserved\
          \ but the values\n    are overwritten by values in `Y` when the key sets of `X`\
          \ and `Y` intersect. Elements in `Y` with\n    non-intersecting keys are appended,\
          \ retaining their partial order.\n\nIf `rule` makes use of the `oldSelf` variable\
          \ it is implicitly a `transition rule`.\n\nBy default, the `oldSelf` variable is\
          \ the same type as `self`. When `optionalOldSelf` is true, the `oldSelf` variable\
          \ is a CEL optional\n variable whose value() is the same type as `self`.\nSee the\
          \ documentation for the `optionalOldSelf` field for details.\n\nTransition rules\
          \ by default are applied only on UPDATE requests and are skipped if an old value\
          \ could not be found. You can opt a transition rule into unconditional evaluation\
          \ by setting `optionalOldSelf` to true."
        required: true
  WebhookClientConfig:
    description: >-
      WebhookClientConfig contains the information to make a TLS connection with the webhook.
    properties:
      caBundle:
        type: string
        description: >-
          caBundle is a PEM encoded CA bundle which will be used to validate the webhook's
          server certificate. If unspecified, system trust roots on the apiserver are used.
        required: false
      service:
        type: ServiceReference
        description: >-
          service is a reference to the service for this webhook. Either service or url must
          be specified.


          If the webhook is running within the cluster, then you should use `service`.
        required: false
      url:
        type: string
        description: >-
          url gives the location of the webhook, in standard URL form (`scheme://host:port/path`).
          Exactly one of `url` or `service` must be specified.


          The `host` should not refer to a service running in the cluster; use the `service`
          field instead. The host might be resolved via external DNS in some apiservers (e.g.,
          `kube-apiserver` cannot resolve in-cluster DNS as that would be a layering violation).
          `host` may also be an IP address.


          Please note that using `localhost` or `127.0.0.1` as a `host` is risky unless you
          take great care to run this webhook on all hosts which run an apiserver which might
          need to make calls to this webhook. Such installs are likely to be non-portable,
          i.e., not easy to turn up in a new cluster.


          The scheme must be "https"; the URL must begin with "https://".


          A path is optional, and if present may be any string permissible in a URL. You may
          use the path to pass an arbitrary string to the webhook, for example, a cluster
          identifier.


          Attempting to use a user or basic auth e.g. "user:password@" is not allowed. Fragments
          ("#...") and query parameters ("?...") are not allowed, either.
        required: false
  WebhookConversion:
    description: WebhookConversion describes how to call a conversion webhook
    properties:
      clientConfig:
        type: WebhookClientConfig
        description: >-
          clientConfig is the instructions for how to call the webhook if strategy is `Webhook`.
        required: false
      conversionReviewVersions:
        type: list
        description: >-
          conversionReviewVersions is an ordered list of preferred `ConversionReview` versions
          the Webhook expects. The API server will use the first version in the list which
          it supports. If none of the versions specified in this list are supported by API
          server, conversion will fail for the custom resource. If a persisted Webhook configuration
          specifies allowed versions and does not include any versions known to the API Server,
          calls to the webhook will fail.
        required: true
        entry_schema:
          type: string
        metadata:
          x-kubernetes-list-type: atomic
