tosca_definitions_version: tosca_2_0
description: Types generated from JSON Schema by any2tosca
imports:
- url: meta.yaml
  namespace: meta
data_types:
  LeaseSpec:
    description: LeaseSpec is a specification of a Lease.
    properties:
      acquireTime:
        type: meta:MicroTime
        description: acquireTime is a time when the current lease was acquired.
        required: false
      holderIdentity:
        type: string
        description: >-
          holderIdentity contains the identity of the holder of a current lease. If Coordinated
          Leader Election is used, the holder identity must be equal to the elected LeaseCandidate.metadata.name
          field.
        required: false
      leaseDurationSeconds:
        type: integer
        description: >-
          leaseDurationSeconds is a duration that candidates for a lease need to wait to force
          acquire it. This is measured against the time of last observed renewTime.
        required: false
      leaseTransitions:
        type: integer
        description: >-
          leaseTransitions is the number of transitions of a lease between holders.
        required: false
      preferredHolder:
        type: string
        description: >-
          PreferredHolder signals to a lease holder that the lease has a more optimal holder
          and should be given up. This field can only be set if Strategy is also set.
        required: false
      renewTime:
        type: meta:MicroTime
        description: >-
          renewTime is a time when the current holder of a lease has last updated the lease.
        required: false
      strategy:
        type: string
        description: >-
          Strategy indicates the strategy for picking the leader for coordinated leader election.
          If the field is not specified, there is no active coordination for this lease. (Alpha)
          Using this field requires the CoordinatedLeaderElection feature gate to be enabled.
        required: false
node_types:
  Lease:
    description: Lease defines a lease concept.
    metadata:
      x-kubernetes-group-version-kind:
        group: coordination.k8s.io
        kind: Lease
        version: v1
    properties:
      metadata:
        type: meta:ObjectMeta
        description: >-
          More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata
        required: false
      spec:
        type: LeaseSpec
        description: >-
          spec contains the specification of the Lease. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status
        required: false
