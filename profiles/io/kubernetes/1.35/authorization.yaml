tosca_definitions_version: tosca_2_0
description: Types generated from JSON Schema by any2tosca
imports:
- url: meta.yaml
  namespace: meta
data_types:
  FieldSelectorAttributes:
    description: >-
      FieldSelectorAttributes indicates a field limited access. Webhook authors are encouraged
      to * ensure rawSelector and requirements are not both set * consider the requirements
      field if set * not try to parse or consider the rawSelector field if set. This is to
      avoid another CVE-2022-2880 (i.e. getting different systems to agree on how exactly
      to parse a query is not something we want), see https://www.oxeye.io/resources/golang-parameter-smuggling-attack
      for more details. For the *SubjectAccessReview endpoints of the kube-apiserver: * If
      rawSelector is empty and requirements are empty, the request is not limited. * If rawSelector
      is present and requirements are empty, the rawSelector will be parsed and limited if
      the parsing succeeds. * If rawSelector is empty and requirements are present, the requirements
      should be honored * If rawSelector is present and requirements are present, the request
      is invalid.
    properties:
      rawSelector:
        type: string
        description: >-
          rawSelector is the serialization of a field selector that would be included in a
          query parameter. Webhook implementations are encouraged to ignore rawSelector. The
          kube-apiserver's *SubjectAccessReview will parse the rawSelector as long as the
          requirements are not present.
        required: false
      requirements:
        type: list
        description: >-
          requirements is the parsed interpretation of a field selector. All requirements
          must be met for a resource instance to match the selector. Webhook implementations
          should handle requirements, but how to handle them is up to the webhook. Since requirements
          can only limit the request, it is safe to authorize as unlimited request if the
          requirements are not understood.
        required: false
        entry_schema:
          type: meta:FieldSelectorRequirement
        metadata:
          x-kubernetes-list-type: atomic
  LabelSelectorAttributes:
    description: >-
      LabelSelectorAttributes indicates a label limited access. Webhook authors are encouraged
      to * ensure rawSelector and requirements are not both set * consider the requirements
      field if set * not try to parse or consider the rawSelector field if set. This is to
      avoid another CVE-2022-2880 (i.e. getting different systems to agree on how exactly
      to parse a query is not something we want), see https://www.oxeye.io/resources/golang-parameter-smuggling-attack
      for more details. For the *SubjectAccessReview endpoints of the kube-apiserver: * If
      rawSelector is empty and requirements are empty, the request is not limited. * If rawSelector
      is present and requirements are empty, the rawSelector will be parsed and limited if
      the parsing succeeds. * If rawSelector is empty and requirements are present, the requirements
      should be honored * If rawSelector is present and requirements are present, the request
      is invalid.
    properties:
      rawSelector:
        type: string
        description: >-
          rawSelector is the serialization of a field selector that would be included in a
          query parameter. Webhook implementations are encouraged to ignore rawSelector. The
          kube-apiserver's *SubjectAccessReview will parse the rawSelector as long as the
          requirements are not present.
        required: false
      requirements:
        type: list
        description: >-
          requirements is the parsed interpretation of a label selector. All requirements
          must be met for a resource instance to match the selector. Webhook implementations
          should handle requirements, but how to handle them is up to the webhook. Since requirements
          can only limit the request, it is safe to authorize as unlimited request if the
          requirements are not understood.
        required: false
        entry_schema:
          type: meta:LabelSelectorRequirement
        metadata:
          x-kubernetes-list-type: atomic
  LocalSubjectAccessReview:
    description: >-
      LocalSubjectAccessReview checks whether or not a user or group can perform an action
      in a given namespace. Having a namespace scoped resource makes it much easier to grant
      namespace scoped policy that includes permissions checking.
    metadata:
      x-kubernetes-group-version-kind:
        group: authorization.k8s.io
        kind: LocalSubjectAccessReview
        version: v1
    properties:
      apiVersion:
        type: string
        description: >-
          APIVersion defines the versioned schema of this representation of an object. Servers
          should convert recognized schemas to the latest internal value, and may reject unrecognized
          values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
        required: false
      kind:
        type: string
        description: >-
          Kind is a string value representing the REST resource this object represents. Servers
          may infer this from the endpoint the client submits requests to. Cannot be updated.
          In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
        required: false
      metadata:
        type: meta:ObjectMeta
        description: >-
          Standard list metadata. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata
        required: false
      spec:
        type: SubjectAccessReviewSpec
        description: >-
          Spec holds information about the request being evaluated.  spec.namespace must be
          equal to the namespace you made the request against.  If empty, it is defaulted.
        required: true
      status:
        type: SubjectAccessReviewStatus
        description: >-
          Status is filled in by the server and indicates whether the request is allowed or
          not
        required: false
  NonResourceAttributes:
    description: >-
      NonResourceAttributes includes the authorization attributes available for non-resource
      requests to the Authorizer interface
    properties:
      path:
        type: string
        description: Path is the URL path of the request
        required: false
      verb:
        type: string
        description: Verb is the standard HTTP verb
        required: false
  NonResourceRule:
    description: >-
      NonResourceRule holds information that describes a rule for the non-resource
    properties:
      nonResourceURLs:
        type: list
        description: >-
          NonResourceURLs is a set of partial urls that a user should have access to.  *s
          are allowed, but only as the full, final step in the path.  "*" means all.
        required: false
        entry_schema:
          type: string
        metadata:
          x-kubernetes-list-type: atomic
      verbs:
        type: list
        description: >-
          Verb is a list of kubernetes non-resource API verbs, like: get, post, put, delete,
          patch, head, options.  "*" means all.
        required: true
        entry_schema:
          type: string
        metadata:
          x-kubernetes-list-type: atomic
  ResourceAttributes:
    description: >-
      ResourceAttributes includes the authorization attributes available for resource requests
      to the Authorizer interface
    properties:
      fieldSelector:
        type: FieldSelectorAttributes
        description: >-
          fieldSelector describes the limitation on access based on field.  It can only limit
          access, not broaden it.
        required: false
      group:
        type: string
        description: Group is the API Group of the Resource.  "*" means all.
        required: false
      labelSelector:
        type: LabelSelectorAttributes
        description: >-
          labelSelector describes the limitation on access based on labels.  It can only limit
          access, not broaden it.
        required: false
      name:
        type: string
        description: >-
          Name is the name of the resource being requested for a "get" or deleted for a "delete".
          "" (empty) means all.
        required: false
      namespace:
        type: string
        description: >-
          Namespace is the namespace of the action being requested.  Currently, there is no
          distinction between no namespace and all namespaces "" (empty) is defaulted for
          LocalSubjectAccessReviews "" (empty) is empty for cluster-scoped resources "" (empty)
          means "all" for namespace scoped resources from a SubjectAccessReview or SelfSubjectAccessReview
        required: false
      resource:
        type: string
        description: >-
          Resource is one of the existing resource types.  "*" means all.
        required: false
      subresource:
        type: string
        description: >-
          Subresource is one of the existing resource types.  "" means none.
        required: false
      verb:
        type: string
        description: >-
          Verb is a kubernetes resource API verb, like: get, list, watch, create, update,
          delete, proxy.  "*" means all.
        required: false
      version:
        type: string
        description: Version is the API Version of the Resource.  "*" means all.
        required: false
  ResourceRule:
    description: >-
      ResourceRule is the list of actions the subject is allowed to perform on resources.
      The list ordering isn't significant, may contain duplicates, and possibly be incomplete.
    properties:
      apiGroups:
        type: list
        description: >-
          APIGroups is the name of the APIGroup that contains the resources.  If multiple
          API groups are specified, any action requested against one of the enumerated resources
          in any API group will be allowed.  "*" means all.
        required: false
        entry_schema:
          type: string
        metadata:
          x-kubernetes-list-type: atomic
      resourceNames:
        type: list
        description: >-
          ResourceNames is an optional white list of names that the rule applies to.  An empty
          set means that everything is allowed.  "*" means all.
        required: false
        entry_schema:
          type: string
        metadata:
          x-kubernetes-list-type: atomic
      resources:
        type: list
        description: >-
          Resources is a list of resources this rule applies to.  "*" means all in the specified
          apiGroups.
           "*/foo" represents the subresource 'foo' for all resources in the specified
          apiGroups.
        required: false
        entry_schema:
          type: string
        metadata:
          x-kubernetes-list-type: atomic
      verbs:
        type: list
        description: >-
          Verb is a list of kubernetes resource API verbs, like: get, list, watch, create,
          update, delete, proxy.  "*" means all.
        required: true
        entry_schema:
          type: string
        metadata:
          x-kubernetes-list-type: atomic
  SelfSubjectAccessReview:
    description: >-
      SelfSubjectAccessReview checks whether or the current user can perform an action.  Not
      filling in a spec.namespace means "in all namespaces".  Self is a special case, because
      users should always be able to check whether they can perform an action
    metadata:
      x-kubernetes-group-version-kind:
        group: authorization.k8s.io
        kind: SelfSubjectAccessReview
        version: v1
    properties:
      apiVersion:
        type: string
        description: >-
          APIVersion defines the versioned schema of this representation of an object. Servers
          should convert recognized schemas to the latest internal value, and may reject unrecognized
          values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
        required: false
      kind:
        type: string
        description: >-
          Kind is a string value representing the REST resource this object represents. Servers
          may infer this from the endpoint the client submits requests to. Cannot be updated.
          In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
        required: false
      metadata:
        type: meta:ObjectMeta
        description: >-
          Standard list metadata. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata
        required: false
      spec:
        type: SelfSubjectAccessReviewSpec
        description: >-
          Spec holds information about the request being evaluated.  user and groups must
          be empty
        required: true
      status:
        type: SubjectAccessReviewStatus
        description: >-
          Status is filled in by the server and indicates whether the request is allowed or
          not
        required: false
  SelfSubjectAccessReviewSpec:
    description: >-
      SelfSubjectAccessReviewSpec is a description of the access request.  Exactly one of
      ResourceAuthorizationAttributes and NonResourceAuthorizationAttributes must be set
    properties:
      nonResourceAttributes:
        type: NonResourceAttributes
        description: >-
          NonResourceAttributes describes information for a non-resource access request
        required: false
      resourceAttributes:
        type: ResourceAttributes
        description: >-
          ResourceAuthorizationAttributes describes information for a resource access request
        required: false
  SelfSubjectRulesReview:
    description: >-
      SelfSubjectRulesReview enumerates the set of actions the current user can perform within
      a namespace. The returned list of actions may be incomplete depending on the server's
      authorization mode, and any errors experienced during the evaluation. SelfSubjectRulesReview
      should be used by UIs to show/hide actions, or to quickly let an end user reason about
      their permissions. It should NOT Be used by external systems to drive authorization
      decisions as this raises confused deputy, cache lifetime/revocation, and correctness
      concerns. SubjectAccessReview, and LocalAccessReview are the correct way to defer authorization
      decisions to the API server.
    metadata:
      x-kubernetes-group-version-kind:
        group: authorization.k8s.io
        kind: SelfSubjectRulesReview
        version: v1
    properties:
      apiVersion:
        type: string
        description: >-
          APIVersion defines the versioned schema of this representation of an object. Servers
          should convert recognized schemas to the latest internal value, and may reject unrecognized
          values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
        required: false
      kind:
        type: string
        description: >-
          Kind is a string value representing the REST resource this object represents. Servers
          may infer this from the endpoint the client submits requests to. Cannot be updated.
          In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
        required: false
      metadata:
        type: meta:ObjectMeta
        description: >-
          Standard list metadata. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata
        required: false
      spec:
        type: SelfSubjectRulesReviewSpec
        description: Spec holds information about the request being evaluated.
        required: true
      status:
        type: SubjectRulesReviewStatus
        description: >-
          Status is filled in by the server and indicates the set of actions a user can perform.
        required: false
  SelfSubjectRulesReviewSpec:
    description: >-
      SelfSubjectRulesReviewSpec defines the specification for SelfSubjectRulesReview.
    properties:
      namespace:
        type: string
        description: Namespace to evaluate rules for. Required.
        required: false
  SubjectAccessReview:
    description: >-
      SubjectAccessReview checks whether or not a user or group can perform an action.
    metadata:
      x-kubernetes-group-version-kind:
        group: authorization.k8s.io
        kind: SubjectAccessReview
        version: v1
    properties:
      apiVersion:
        type: string
        description: >-
          APIVersion defines the versioned schema of this representation of an object. Servers
          should convert recognized schemas to the latest internal value, and may reject unrecognized
          values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
        required: false
      kind:
        type: string
        description: >-
          Kind is a string value representing the REST resource this object represents. Servers
          may infer this from the endpoint the client submits requests to. Cannot be updated.
          In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
        required: false
      metadata:
        type: meta:ObjectMeta
        description: >-
          Standard list metadata. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata
        required: false
      spec:
        type: SubjectAccessReviewSpec
        description: Spec holds information about the request being evaluated
        required: true
      status:
        type: SubjectAccessReviewStatus
        description: >-
          Status is filled in by the server and indicates whether the request is allowed or
          not
        required: false
  SubjectAccessReviewSpec:
    description: >-
      SubjectAccessReviewSpec is a description of the access request.  Exactly one of ResourceAuthorizationAttributes
      and NonResourceAuthorizationAttributes must be set
    properties:
      extra:
        type: map
        description: >-
          Extra corresponds to the user.Info.GetExtra() method from the authenticator.  Since
          that is input to the authorizer it needs a reflection here.
        required: false
        entry_schema:
          type: list
      groups:
        type: list
        description: Groups is the groups you're testing for.
        required: false
        entry_schema:
          type: string
        metadata:
          x-kubernetes-list-type: atomic
      nonResourceAttributes:
        type: NonResourceAttributes
        description: >-
          NonResourceAttributes describes information for a non-resource access request
        required: false
      resourceAttributes:
        type: ResourceAttributes
        description: >-
          ResourceAuthorizationAttributes describes information for a resource access request
        required: false
      uid:
        type: string
        description: UID information about the requesting user.
        required: false
      user:
        type: string
        description: >-
          User is the user you're testing for. If you specify "User" but not "Groups", then
          is it interpreted as "What if User were not a member of any groups
        required: false
  SubjectAccessReviewStatus:
    description: SubjectAccessReviewStatus
    properties:
      allowed:
        type: boolean
        description: >-
          Allowed is required. True if the action would be allowed, false otherwise.
        required: true
      denied:
        type: boolean
        description: >-
          Denied is optional. True if the action would be denied, otherwise false. If both
          allowed is false and denied is false, then the authorizer has no opinion on whether
          to authorize the action. Denied may not be true if Allowed is true.
        required: false
      evaluationError:
        type: string
        description: >-
          EvaluationError is an indication that some error occurred during the authorization
          check. It is entirely possible to get an error and be able to continue determine
          authorization status in spite of it. For instance, RBAC can be missing a role, but
          enough roles are still present and bound to reason about the request.
        required: false
      reason:
        type: string
        description: >-
          Reason is optional.  It indicates why a request was allowed or denied.
        required: false
  SubjectRulesReviewStatus:
    description: >-
      SubjectRulesReviewStatus contains the result of a rules check. This check can be incomplete
      depending on the set of authorizers the server is configured with and any errors experienced
      during evaluation. Because authorization rules are additive, if a rule appears in a
      list it's safe to assume the subject has that permission, even if that list is incomplete.
    properties:
      evaluationError:
        type: string
        description: >-
          EvaluationError can appear in combination with Rules. It indicates an error occurred
          during rule evaluation, such as an authorizer that doesn't support rule evaluation,
          and that ResourceRules and/or NonResourceRules may be incomplete.
        required: false
      incomplete:
        type: boolean
        description: >-
          Incomplete is true when the rules returned by this call are incomplete. This is
          most commonly encountered when an authorizer, such as an external authorizer, doesn't
          support rules evaluation.
        required: true
      nonResourceRules:
        type: list
        description: >-
          NonResourceRules is the list of actions the subject is allowed to perform on non-resources.
          The list ordering isn't significant, may contain duplicates, and possibly be incomplete.
        required: true
        entry_schema:
          type: NonResourceRule
        metadata:
          x-kubernetes-list-type: atomic
      resourceRules:
        type: list
        description: >-
          ResourceRules is the list of actions the subject is allowed to perform on resources.
          The list ordering isn't significant, may contain duplicates, and possibly be incomplete.
        required: true
        entry_schema:
          type: ResourceRule
        metadata:
          x-kubernetes-list-type: atomic
