tosca_definitions_version: tosca_2_0
description: Types generated from JSON Schema by any2tosca
imports:
- url: meta.yaml
  namespace: meta
- url: core.yaml
  namespace: core
data_types:
  EventSeries:
    description: >-
      EventSeries contain information on series of events, i.e. thing that was/is happening
      continuously for some time. How often to update the EventSeries is up to the event reporters.
      The default event reporter in "k8s.io/client-go/tools/events/event_broadcaster.go" shows
      how this struct is updated on heartbeats and can guide customized reporter implementations.
    properties:
      count:
        type: integer
        description: >-
          count is the number of occurrences in this series up to the last heartbeat time.
        required: true
      lastObservedTime:
        type: meta:MicroTime
        description: >-
          lastObservedTime is the time when last Event from the series was seen before last
          heartbeat.
        required: true
node_types:
  Event:
    description: >-
      Event is a report of an event somewhere in the cluster. It generally denotes some state
      change in the system. Events have a limited retention time and triggers and messages
      may evolve with time.  Event consumers should not rely on the timing of an event with
      a given Reason reflecting a consistent underlying trigger, or the continued existence
      of events with that Reason.  Events should be treated as informative, best-effort, supplemental
      data.
    metadata:
      x-kubernetes-group-version-kind:
        group: events.k8s.io
        kind: Event
        version: v1
    properties:
      action:
        type: string
        description: >-
          action is what action was taken/failed regarding to the regarding object. It is
          machine-readable. This field cannot be empty for new Events and it can have at most
          128 characters.
        required: false
      deprecatedCount:
        type: integer
        description: >-
          deprecatedCount is the deprecated field assuring backward compatibility with core.v1
          Event type.
        required: false
      deprecatedFirstTimestamp:
        type: meta:Time
        description: >-
          deprecatedFirstTimestamp is the deprecated field assuring backward compatibility
          with core.v1 Event type.
        required: false
      deprecatedLastTimestamp:
        type: meta:Time
        description: >-
          deprecatedLastTimestamp is the deprecated field assuring backward compatibility
          with core.v1 Event type.
        required: false
      deprecatedSource:
        type: core:EventSource
        description: >-
          deprecatedSource is the deprecated field assuring backward compatibility with core.v1
          Event type.
        required: false
      eventTime:
        type: meta:MicroTime
        description: >-
          eventTime is the time when this Event was first observed. It is required.
        required: true
      metadata:
        type: meta:ObjectMeta
        description: >-
          Standard object's metadata. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata
        required: false
      note:
        type: string
        description: >-
          note is a human-readable description of the status of this operation. Maximal length
          of the note is 1kB, but libraries should be prepared to handle values up to 64kB.
        required: false
      reason:
        type: string
        description: >-
          reason is why the action was taken. It is human-readable. This field cannot be empty
          for new Events and it can have at most 128 characters.
        required: false
      regarding:
        type: core:ObjectReference
        description: >-
          regarding contains the object this Event is about. In most cases it's an Object
          reporting controller implements, e.g. ReplicaSetController implements ReplicaSets
          and this event is emitted because it acts on some changes in a ReplicaSet object.
        required: false
      related:
        type: core:ObjectReference
        description: >-
          related is the optional secondary object for more complex actions. E.g. when regarding
          object triggers a creation or deletion of related object.
        required: false
      reportingController:
        type: string
        description: >-
          reportingController is the name of the controller that emitted this Event, e.g.
          `kubernetes.io/kubelet`. This field cannot be empty for new Events.
        required: false
      reportingInstance:
        type: string
        description: >-
          reportingInstance is the ID of the controller instance, e.g. `kubelet-xyzf`. This
          field cannot be empty for new Events and it can have at most 128 characters.
        required: false
      series:
        type: EventSeries
        description: >-
          series is data about the Event series this event represents or nil if it's a singleton
          Event.
        required: false
      type:
        type: string
        description: >-
          type is the type of this event (Normal, Warning), new types could be added in the
          future. It is machine-readable. This field cannot be empty for new Events.
        required: false
